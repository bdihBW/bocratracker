/* ---------- Files ---------- */

function magicOK(ext, b) {
  const s = (i, n) => String.fromCharCode(...b.slice(i, i + n));
  switch (ext) {
    case 'pdf': return s(0, 4) === '%PDF';
    case 'png': return b[0] === 0x89 && s(1, 3) === 'PNG';
    case 'jpg': case 'jpeg': return b[0] === 0xFF && b[1] === 0xD8;
    case 'zip': case 'docx': case 'xlsx': case 'pptx': return s(0, 2) === 'PK';
    case 'mp4': return s(4, 4) === 'ftyp';
    case 'svg': return /<svg/i.test(new TextDecoder().decode(b));
    default: return !b.slice(0, 1024).includes(0);
  }
}
async function readFile(f) {
  const ext = (f.name.split('.').pop() || '').toLowerCase();
  if (!FILE_TYPES.includes(ext)) return { error: f.name + ': .' + ext + ' files are not accepted. Accepted: ' + FILE_TYPES.join(', ') + '.' };
  if (f.size > MAX_FILE) return { error: f.name + ' is larger than 100 MB.' };
  const head = new Uint8Array(await f.slice(0, 4096).arrayBuffer());
  if (!magicOK(ext, head)) return { error: f.name + ': the file content does not match a .' + ext + ' file.' };
  let data = null, sha = '';
  if (f.size <= 1.5 * 1048576) data = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(null); r.readAsDataURL(f); });
  try {
    if (window.crypto && crypto.subtle && f.size <= 20 * 1048576) {
      const h = await crypto.subtle.digest('SHA-256', await f.arrayBuffer());
      sha = [...new Uint8Array(h)].map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { /* hashing unavailable */ }
  return { f, data, sha };
}
// Same file name on the same item creates a new version (FR-DOC-04)
function addFile(info, meta) {
  const S = St(), name = info.f.name;
  let d = meta.docId ? S.documents.find(x => x.id === meta.docId) : S.documents.find(x => !x.deleted && x.entityType === meta.entityType && (x.entityId || null) === (meta.entityId || null) && x.ws === meta.ws && x.versions[x.versions.length - 1].name.toLowerCase() === name.toLowerCase());
  if (!d) {
    d = { id: uid('d'), title: meta.title || name.replace(/\.[^.]+$/, ''), category: meta.category || 'Other', ws: meta.ws, entityType: meta.entityType, entityId: meta.entityId || null, visibleToDevs: !!meta.visibleToDevs, deleted: null, deletedBy: null, versions: [] };
    S.documents.push(d);
  }
  const v = { no: d.versions.length + 1, name, size: info.f.size, by: Sess.userId, at: D.now(), comment: meta.comment || '', scan: 'Not scanned', sha: info.sha, data: info.data };
  d.versions.push(v);
  audit(v.no > 1 ? 'document.version' : 'document.upload', 'document', d.id, null, { name, version: v.no, size: v.size, ws: d.ws, sha256: info.sha });
  return d;
}
async function readAll(files) {
  const out = [];
  for (const f of files) { const r = await readFile(f); if (r.error) return { error: r.error }; out.push(r); }
  return { files: out };
}

ACT.uploadModal = el => {
  const u = me(), S = St(), docId = el.dataset.doc, d = docId && S.documents.find(x => x.id === docId);
  const ent = el.dataset.entity || 'library', eid = el.dataset.eid || '', ws = el.dataset.ws || '';
  if ((ent === 'bank' || (d && d.entityType === 'bank')) && !can.bankUpload(u)) return toast('Only BDIH and BOCRA add documents to the document bank.', 'err');
  modal(d ? 'Upload a new version' : ent === 'bank' ? 'Add to the document bank' : 'Upload document', `<form data-form="upload"><input type="hidden" name="doc" value="${docId || ''}"><input type="hidden" name="entity" value="${ent}"><input type="hidden" name="eid" value="${eid}">
   ${d ? `<p>New version of <strong>${esc(d.title)}</strong> (currently v${d.versions.length}).</p>` : `${fld('Title (defaults to the file name)', inp('title', ''))}${fld('Category', sel('category', ent === 'bank' ? S.lookups.bankCategories : S.lookups.docCategories, el.dataset.cat || (ent === 'bank' ? 'Template' : 'Other')))}
   ${ws ? `<input type="hidden" name="ws" value="${ws}">` : fld('Workstream', sel('ws', wsOptions(u, true), (wsOf(u) || ['S'])[0]))}
   ${isOversight(u) && ent === 'library' ? '<label class="chk"><input type="checkbox" name="vis"> Visible to developers (Shared workstream only)</label>' : ''}`}
   ${fld('File', `<input type="file" name="file" required accept="${FILE_TYPES.map(x => '.' + x).join(',')}">`)}${fld('Version comment', inp('comment', ''))}
   <p class="small muted">Up to 100 MB.</p>
   <button class="btn">Upload</button></form>`);
};
FORM.upload = async fd => {
  const u = me(), S = St(), f = fd.get('file');
  if (!f || !f.size) return toast('Choose a file.', 'err');
  const r = await readFile(f);
  if (r.error) return toast(r.error, 'err');
  let meta;
  const docId = fd.get('doc');
  if (docId) {
    const d = S.documents.find(x => x.id === docId);
    if (!d || !canSeeItem(u, d)) return toast('Not available.', 'err');
    if (d.entityType === 'bank' && !can.bankUpload(u)) return toast('Only BDIH and BOCRA update the document bank.', 'err');
    meta = { docId, comment: fd.get('comment') };
  } else {
    const ent = fd.get('entity'), eid = fd.get('eid') || null;
    let ws = fd.get('ws'), vis = !!fd.get('vis');
    if (ent === 'activity') { const a = actOf(eid); ws = a.ws; vis = a.visibleToDevs; }
    if (ent === 'meeting') { const m = S.meetings.find(x => x.id === eid); ws = m.ws; vis = !!m.visibleToDevs; }
    if (ent === 'bank') { if (!can.bankUpload(u)) return toast('Only BDIH and BOCRA add documents to the document bank.', 'err'); ws = 'S'; vis = true; }
    if (!isOversight(u) && !(wsOf(u) || []).includes(ws)) return toast('You can only upload to your own workstream.', 'err');
    meta = { entityType: ent, entityId: eid, ws, visibleToDevs: ws === 'S' && vis, title: fd.get('title').trim(), category: fd.get('category'), comment: fd.get('comment') };
  }
  const d = addFile(r, meta);
  if (meta.entityType === 'meeting') { const m = S.meetings.find(x => x.id === meta.entityId); if (m) m.minutesDoc = d.id; }
  commit('Uploaded ' + f.name + ' as version ' + d.versions.length + '.');
};

function docVersion(el) {
  const d = St().documents.find(x => x.id === el.dataset.id);
  if (!d || d.deleted || !canSeeItem(me(), d)) { toast('This document is not available.', 'err'); return null; }
  const v = el.dataset.v ? d.versions.find(x => x.no === +el.dataset.v) : d.versions[d.versions.length - 1];
  return { d, v };
}
ACT.download = el => {
  const x = docVersion(el); if (!x) return;
  audit('document.download', 'document', x.d.id, null, { version: x.v.no });
  Store.save();
  if (x.v.data) return fetch(x.v.data).then(r => r.blob()).then(b => dl(b, x.v.name));
  dl(new Blob(['Placeholder for "' + x.v.name + '".\r\nThis sample file has no content.'], { type: 'text/plain' }), x.v.name + '.txt');
};
ACT.preview = el => {
  const x = docVersion(el); if (!x || !x.v.data) return;
  fetch(x.v.data).then(r => r.blob()).then(b => {
    const url = URL.createObjectURL(b);
    modal(x.d.title, /pdf$/i.test(x.v.name) ? `<iframe class="pv" src="${url}" title="${esc(x.d.title)}"></iframe>` : `<img class="pv" src="${url}" alt="${esc(x.d.title)}">`, true);
  });
};
ACT.versions = el => {
  const d = St().documents.find(x => x.id === el.dataset.id);
  modal('Versions of ' + d.title, table(['Version', 'File', 'Size', 'Uploaded by', 'When', 'Comment', 'Scan', ''], d.versions.slice().reverse().map(v => tr(['v' + v.no, esc(v.name), bytes(v.size), esc(uname(v.by)), D.stamp(v.at), esc(v.comment), esc(v.scan), `<button class="btn sm ghost" data-act="download" data-id="${d.id}" data-v="${v.no}">Download</button>`]))), true);
};
ACT.deleteDoc = el => {
  const S = St(), d = S.documents.find(x => x.id === el.dataset.id), u = me();
  if (!can.docDelete(u, d)) return toast('Only the uploader or BDIH can delete this document.', 'err');
  if (S.submissions.some(s => s.state === 'Approved' && (s.docIds || []).includes(d.id))) return toast('Documents attached to an approved submission cannot be deleted.', 'err');
  if (!confirm('Delete "' + d.title + '"? An administrator can restore it for 90 days.')) return;
  d.deleted = D.now(); d.deletedBy = u.id;
  audit('document.delete', 'document', d.id);
  commit('Document deleted.');
};
ACT.restoreDoc = el => { const d = St().documents.find(x => x.id === el.dataset.id); d.deleted = null; d.deletedBy = null; audit('document.restore', 'document', d.id); commit('Document restored.'); };

/* ---------- Submissions, reviews and approvals (FR-REV) ---------- */

function reviewActs(a) { return { ba: a.bdihReviewId && actOf(a.bdihReviewId), oa: a.bocraReviewId && actOf(a.bocraReviewId) }; }
function resetAct(x) { if (x) Object.assign(x, { actualStart: null, actualFinish: null, pct: 0, status: 'Not started' }); }

function openSubmit(a) {
  const u = me();
  const opts = visActs(u).filter(x => can.submit(u, x) && ['Not started', 'In progress', 'Returned to developer'].includes(x.status));
  if (!a && !opts.length) return toast('Nothing is ready for you to submit.', 'err');
  const viaBdih = a ? a.ws !== 'S' : true;
  modal('Submit deliverable', `<form data-form="submit">
   ${a ? `<input type="hidden" name="id" value="${a.id}"><p><strong>${esc(a.name)}</strong> ${wsTag(a.ws)}</p>` : fld('Deliverable', sel('id', opts.map(x => [x.id, x.name + ' (' + wsName(x.ws) + ')'])))}
   ${fld('Cover note', ta('cover', '', 'required'))}
   ${fld('Files (one or more)', `<input type="file" name="file" multiple required accept="${FILE_TYPES.map(x => '.' + x).join(',')}">`)}
   <p class="small muted">${viaBdih ? 'BDIH reviews within ' + St().settings.bdihReviewDays + ' business days, then BOCRA decides within ' + St().settings.bocraReviewDays + '.' : 'BDIH deliverables go to BOCRA for a decision within ' + St().settings.bocraReviewDays + ' business days.'}</p>
   <button class="btn">Submit for review</button></form>`);
}
ACT.submitModal = el => openSubmit(actOf(el.dataset.id));
ACT.submitPick = () => openSubmit(null);

FORM.submit = async fd => {
  const u = me(), S = St(), a = actOf(fd.get('id'));
  if (!can.submit(u, a)) return toast('You cannot submit this deliverable.', 'err');
  if (S.submissions.some(s => s.activityId === a.id && s.state.startsWith('Under'))) return toast('This deliverable is already under review.', 'err');
  const cover = String(fd.get('cover') || '').trim();
  const files = fd.getAll('file').filter(f => f && f.size);
  if (!cover || !files.length) return toast('Add a cover note and at least one file.', 'err');
  const read = await readAll(files);
  if (read.error) return toast(read.error, 'err');
  const docIds = read.files.map(r => addFile(r, { entityType: 'activity', entityId: a.id, ws: a.ws, visibleToDevs: a.visibleToDevs, category: a.docCat || 'Other', comment: 'Submission' }).id);
  const today = D.today(), cal = S._cal;
  const viaBdih = a.ws !== 'S';
  const version = S.submissions.filter(s => s.activityId === a.id).length + 1;
  const sub = { id: uid('s'), activityId: a.id, ws: a.ws, version, by: u.id, at: D.now(), coverNote: cover, docIds, state: viaBdih ? 'Under BDIH review' : 'Under BOCRA review' };
  const { ba, oa } = reviewActs(a);
  const stage = viaBdih ? 'BDIH' : 'BOCRA';
  const ra = viaBdih ? ba : oa;
  const rev = { id: uid('r'), submissionId: sub.id, stage, reviewer: (ra && resUser(ra.lead)) || usersWith(viaBdih ? 'BDIH_LEAD' : 'BOCRA_REP')[0], due: cal.addBD(today, viaBdih ? +S.settings.bdihReviewDays : +S.settings.bocraReviewDays), decidedAt: null, outcome: null, findings: '' };
  S.submissions.push(sub); S.reviews.push(rev);
  hist(a, 'status', a.status, sub.state, 'Submitted v' + version);
  Object.assign(a, { status: sub.state, pct: 100, actualStart: a.actualStart || today, actualFinish: today });
  if (viaBdih) resetAct(oa);
  if (ra) Object.assign(ra, { actualStart: today, actualFinish: null, pct: 0, status: 'In progress' });
  audit('submission.create', 'submission', sub.id, null, { activity: a.name, version, files: docIds.length });
  notify([rev.reviewer].concat(viaBdih ? usersWith('BDIH_LEAD') : usersWith('BOCRA_REP')), 'Review assigned', `${stage} review assigned: ${a.name} v${version}, due ${D.nice(rev.due)}`, Object.assign(entOf(a), { link: '#/submissions?tab=' + stage.toLowerCase() }));
  notify(devLeads(a.ws).filter(x => x !== u.id), 'Submission received', `Submission received: ${a.name} v${version}`, entOf(a));
  commit('Submitted. ' + stage + ' review due ' + D.nice(rev.due) + '.');
};

function reviewCtx(id) { const S = St(), r = S.reviews.find(x => x.id === id), s = S.submissions.find(x => x.id === r.submissionId); return { r, s, a: actOf(s.activityId) }; }
function subSummary(s, a) {
  return `<p><strong>${esc(a.name)}</strong> ${wsTag(a.ws)} version ${s.version}, submitted by ${esc(uname(s.by))} on ${D.stamp(s.at)}</p><blockquote>${esc(s.coverNote)}</blockquote>
   <p class="small">Files: ${(s.docIds || []).map(id => { const d = St().documents.find(x => x.id === id); return d ? `<button class="link" data-act="download" data-id="${d.id}">${esc(d.title)}</button>` : ''; }).join(', ')}</p>`;
}
ACT.reviewModal = el => {
  const { r, s, a } = reviewCtx(el.dataset.id);
  modal('BDIH review recommendation', `<form data-form="review"><input type="hidden" name="id" value="${r.id}">${subSummary(s, a)}<p>Due ${D.nice(r.due)} ${timer(r.due)}</p>
   <fieldset><legend>Checklist against BOCRA's requirements</legend>${St().lookups.checklist.map((c, k) => `<label class="chk"><input type="checkbox" name="c${k}"> ${esc(c)}</label>`).join('')}</fieldset>
   ${fld('Recommendation', sel('outcome', [['Ready', 'Ready: send to BOCRA'], ['Not ready', 'Send back to developer for correction']]))}
   ${fld('Findings', ta('findings', ''))}${fld('Marked-up files (optional)', '<input type="file" name="file" multiple>')}
   <button class="btn">Record recommendation</button></form>`, true);
};
FORM.review = async fd => {
  const u = me(), S = St();
  if (!can.bdihReview(u)) return toast('Only BDIH reviewers can record a recommendation.', 'err');
  const { r, s, a } = reviewCtx(fd.get('id'));
  if (r.decidedAt) return toast('This review has already been decided.', 'err');
  const outcome = fd.get('outcome'), findings = String(fd.get('findings') || '').trim();
  if (outcome === 'Not ready' && !findings) return toast('Say what the developer needs to correct.', 'err');
  const files = fd.getAll('file').filter(f => f && f.size);
  const read = await readAll(files);
  if (read.error) return toast(read.error, 'err');
  read.files.forEach(x => addFile(x, { entityType: 'activity', entityId: a.id, ws: a.ws, visibleToDevs: a.visibleToDevs, category: 'Other', comment: 'BDIH mark-up v' + s.version }));
  const today = D.today(), { ba, oa } = reviewActs(a);
  Object.assign(r, { outcome, findings, reviewer: u.id, decidedAt: D.now(), checklist: S.lookups.checklist.map((c, k) => !!fd.get('c' + k)) });
  if (outcome === 'Ready') {
    s.state = 'Under BOCRA review';
    hist(a, 'status', a.status, s.state, 'BDIH: Ready');
    a.status = s.state;
    if (ba) Object.assign(ba, { actualFinish: today, pct: 100, status: 'Complete', actualStart: ba.actualStart || today });
    const rv = { id: uid('r'), submissionId: s.id, stage: 'BOCRA', reviewer: (oa && resUser(oa.lead)) || usersWith('BOCRA_REP')[0], due: S._cal.addBD(today, +S.settings.bocraReviewDays), decidedAt: null, outcome: null, findings: '' };
    S.reviews.push(rv);
    if (oa) Object.assign(oa, { actualStart: today, actualFinish: null, pct: 0, status: 'In progress' });
    notify([rv.reviewer].concat(usersWith('BOCRA_REP')), 'Review assigned', `BOCRA decision needed: ${a.name} v${s.version}, due ${D.nice(rv.due)}`, Object.assign(entOf(a), { link: '#/submissions?tab=bocra' }));
    notify([s.by].concat(devLeads(a.ws)), 'Submission forwarded', `${a.name} v${s.version} recommended Ready and forwarded to BOCRA`, entOf(a));
  } else {
    s.state = 'Returned';
    hist(a, 'status', a.status, 'Returned to developer', findings);
    Object.assign(a, { status: 'Returned to developer', actualFinish: null, pct: Math.min(a.pct, 90) });
    resetAct(ba);
    notify([s.by].concat(devLeads(a.ws)), 'Submission returned', `${a.name} v${s.version} returned by BDIH: Not ready`, entOf(a));
  }
  audit('review.bdih', 'review', r.id, null, { outcome, findings: findings.slice(0, 200) });
  commit('Recommendation recorded: ' + outcome + '.');
};

ACT.decideModal = el => {
  const { r, s, a } = reviewCtx(el.dataset.id);
  const prev = St().reviews.filter(x => x.submissionId === s.id && x.stage === 'BDIH' && x.decidedAt).pop();
  modal('BOCRA decision', `<form data-form="decide"><input type="hidden" name="id" value="${r.id}">${subSummary(s, a)}
   ${prev ? `<p><strong>BDIH recommendation:</strong> ${stb(prev.outcome)} ${esc(prev.findings)}</p>` : ''}<p>Due ${D.nice(r.due)} ${timer(r.due)}</p>
   ${fld('Decision', sel('outcome', [['Approved', 'Approve']].concat(a.ws === 'S' ? [['Returned', 'Send back to BDIH for correction']] : [['Returned to BDIH', 'Send back to BDIH'], ['Returned', 'Send back to developer for correction']])))}${fld('Comments (required when sending back)', ta('findings', ''))}
   <button class="btn">Record decision</button></form>`, true);
};
FORM.decide = fd => {
  const u = me(), S = St();
  if (!can.bocraDecide(u)) return toast('Only the BOCRA Representative can approve or return.', 'err');
  const { r, s, a } = reviewCtx(fd.get('id'));
  if (r.decidedAt) return toast('This review has already been decided.', 'err');
  const outcome = fd.get('outcome'), findings = String(fd.get('findings') || '').trim();
  if (outcome !== 'Approved' && !findings) return toast('Say what needs to be corrected.', 'err');
  const today = D.today(), { ba, oa } = reviewActs(a);
  Object.assign(r, { outcome, findings, reviewer: u.id, decidedAt: D.now() });
  if (outcome === 'Approved') {
    s.state = 'Approved';
    hist(a, 'status', a.status, 'Complete', 'Approved by BOCRA');
    Object.assign(a, { status: 'Complete', pct: 100, actualFinish: a.actualFinish || D.dateOf(s.at) });
    if (ba && !isDone(ba)) Object.assign(ba, { status: 'Complete', pct: 100, actualStart: ba.actualStart || today, actualFinish: ba.actualFinish || today });
    if (oa) Object.assign(oa, { status: 'Complete', pct: 100, actualStart: oa.actualStart || today, actualFinish: today });
    notify([s.by].concat(devLeads(a.ws), usersWith('BDIH_LEAD')), 'Submission approved', `${a.name} v${s.version} approved by BOCRA`, entOf(a));
  } else if (outcome === 'Returned to BDIH') {
    s.state = 'Under BDIH review';
    hist(a, 'status', a.status, s.state, 'BOCRA sent back to BDIH. ' + findings);
    a.status = s.state;
    resetAct(oa);
    if (ba) Object.assign(ba, { actualStart: today, actualFinish: null, pct: 0, status: 'In progress' });
    const rv = { id: uid('r'), submissionId: s.id, stage: 'BDIH', reviewer: (ba && resUser(ba.lead)) || usersWith('BDIH_LEAD')[0], due: S._cal.addBD(today, +S.settings.bdihReviewDays), decidedAt: null, outcome: null, findings: '' };
    S.reviews.push(rv);
    notify(usersWith('BDIH_LEAD').concat(usersWith('BDIH_PO')), 'Returned to BDIH', `${a.name} v${s.version} was sent back to BDIH by BOCRA`, entOf(a));
  } else {
    s.state = 'Returned';
    hist(a, 'status', a.status, 'Returned to developer', findings);
    Object.assign(a, { status: a.ws === 'S' ? 'In progress' : 'Returned to developer', actualFinish: null, pct: Math.min(a.pct, 90) });
    resetAct(ba); resetAct(oa);
    notify([s.by].concat(devLeads(a.ws), usersWith('BDIH_LEAD')), 'Submission returned', `${a.name} v${s.version} returned by BOCRA`, entOf(a));
  }
  audit('review.bocra', 'review', r.id, null, { outcome, findings: findings.slice(0, 200) });
  commit('Decision recorded: ' + outcome + '. Successor activities rescheduled.');
};

/* ---------- Weekly reports ---------- */

ACT.weeklyForm = el => {
  const u = me(), ws = el.dataset.ws;
  if (!can.weekly(u) || !(wsOf(u) || []).includes(ws)) return toast('Only the Developer Lead, or a delegated team member, files the weekly report.', 'err');
  const weeks = weeklyStatus(ws).filter(w => !w.r).map(w => w.we).reverse();
  const open = St().activities.filter(a => !a.deleted && a.ws === ws && ['Task', 'Report'].includes(a.type) && !isDone(a) && a.status !== 'Cancelled' && !a.status.startsWith('Under') && a._si <= sdi() + 10);
  modal('Weekly report: ' + wsName(ws), `<form data-form="weekly" class="fgrid"><input type="hidden" name="ws" value="${ws}">
   ${fld('Week ending', sel('we', weeks.map(w => [w, D.nice(w)]), el.dataset.we || weeks[0]), 'span2')}
   ${fld('Work completed this week', ta('completed', '', 'required'), 'span2')}${fld('Work planned next week', ta('planned', '', 'required'), 'span2')}
   ${fld('Issues', ta('issues', ''))}${fld('Risks', ta('risks', ''))}${fld('Change requests raised', ta('crs', ''))}${fld('Support needed from BDIH or BOCRA', ta('support', ''))}
   <div class="span2"><h3>Update % complete</h3>${table(['Activity', 'Finish', '% done'], open.map(a => tr([esc(a.name), D.short(a.finish), `<input type="number" name="p_${a.id}" value="${a.pct || 0}" min="0" max="100" step="5" aria-label="% done for ${esc(a.name)}">`])), 'No open activities.')}</div>
   ${fld('Attachments', '<input type="file" name="file" multiple>', 'span2')}
   <div class="span2"><button class="btn">File weekly report</button></div></form>`, true);
};
FORM.weekly = async fd => {
  const u = me(), S = St(), ws = fd.get('ws'), we = fd.get('we');
  if (!can.weekly(u) || !(wsOf(u) || []).includes(ws)) return toast('Not allowed.', 'err');
  if (!we || S.weekly.some(w => w.ws === ws && w.weekEnding === we)) return toast('A report for that week is already filed.', 'err');
  const read = await readAll(fd.getAll('file').filter(f => f && f.size));
  if (read.error) return toast(read.error, 'err');
  const rep = { id: uid('w'), ws, weekEnding: we, by: u.id, at: D.now(), pcts: [], reviewedBy: null, reviewedAt: null, comment: '' };
  ['completed', 'planned', 'issues', 'risks', 'crs', 'support'].forEach(k => { rep[k] = String(fd.get(k) || '').trim(); });
  for (const [k, v] of fd.entries()) {
    if (!k.startsWith('p_')) continue;
    const a = actOf(k.slice(2)), pct = Math.round(clamp(v));
    if (!a || a.ws !== ws) continue;
    rep.pcts.push({ id: a.id, pct });
    if (pct !== (+a.pct || 0)) {
      hist(a, 'pct', a.pct, pct, 'Weekly report ' + D.nice(we));
      a.pct = pct;
      if (pct > 0 && !a.actualStart) { hist(a, 'actualStart', '', D.today(), 'Weekly report'); a.actualStart = D.today(); }
      if (pct > 0 && a.status === 'Not started') a.status = 'In progress';
    }
  }
  S.weekly.push(rep);
  read.files.forEach(x => addFile(x, { entityType: 'weekly', entityId: rep.id, ws, category: 'Report', comment: 'Weekly report ' + we }));
  audit('weekly.create', 'weekly', rep.id, null, { ws, weekEnding: we });
  notify(usersWith('BDIH_LEAD').concat(usersWith('BDIH_PO')), 'Weekly report filed', `Weekly report filed: ${wsName(ws)}, week ending ${D.nice(we)}`, { ws, link: '#/weekly?ws=' + ws + '&id=' + rep.id });
  commit('Weekly report filed and progress updated.');
};
FORM.weeklyReview = fd => {
  const w = St().weekly.find(x => x.id === fd.get('id'));
  Object.assign(w, { comment: String(fd.get('comment') || '').trim(), reviewedBy: Sess.userId, reviewedAt: D.now() });
  audit('weekly.review', 'weekly', w.id);
  notify(devLeads(w.ws), 'Weekly report reviewed', `BDIH reviewed your weekly report for ${D.nice(w.weekEnding)}`, { ws: w.ws, link: '#/weekly?id=' + w.id });
  commit('Marked reviewed.');
};

/* ---------- Reports and exports ---------- */

function printHTML(title, html) {
  const f = document.createElement('iframe');
  f.setAttribute('aria-hidden', 'true');
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d = f.contentDocument;
  d.open();

ACT.regEdit = el => {
  const reg = el.dataset.reg, cfg = REG[reg], u = me(), S = St();
  const it = el.dataset.id ? S[cfg.key].find(x => x.id === el.dataset.id) : null;
  const ro = Sess.readOnly || (it && !can.regEdit(u) && !(reg === 'changes' && (can.crRecommend(u) || can.crDecide(u))));
  const x = it || { ws: (wsOf(u) || ['S'])[0], owner: u.id, requestedBy: u.id, raised: D.today(), requested: D.today(), date: D.today(), likelihood: 3, impact: 3, decision: 'Pending', status: '' };
  const field = ([k, label, type, req, perm]) => {
    const dis = ro || (perm && !can[perm](u)) || (reg === 'changes' && !perm && it && !can.regEdit(u)) ? 'disabled' : '';
    const r = req ? 'required' : '';
    let input;
    if (type === 'textarea') input = ta(k, x[k], `${dis} ${r}`);
    else if (type === 'date') input = inp(k, x[k], 'date', `${dis} ${r}`);
    else if (type === 'ws') input = sel(k, wsOptions(u, true), x[k], dis);
    else if (type === 'user') input = sel(k, userOpts(y => isOversight(u) || y.org === u.org || isOversight(y)), x[k], dis);

    else if (Array.isArray(type)) input = sel(k, type, x[k] ?? type[0], dis);
    else input = inp(k, x[k], 'text', `${dis} ${r}`);
    return fld(label, input, type === 'textarea' ? 'span2' : '');

  modal((it ? (ro ? '' : 'Edit ') : 'Add ') + cfg.title.replace(/s$/, '').toLowerCase().replace(/^./, c => c.toUpperCase()), `<form data-form="reg" class="fgrid"><input type="hidden" name="reg" value="${reg}"><input type="hidden" name="id" value="${it ? it.id : ''}">
    ${cfg.fields.map(field).join('')}

FORM.reg = fd => {
  const u = me(), S = St(), reg = fd.get('reg'), cfg = REG[reg], id = fd.get('id');
  let it = id ? S[cfg.key].find(x => x.id === id) : null;
  const vals = {};
  cfg.fields.forEach(([k, , type, req]) => {
    if (!fd.has(k)) return;
    let v = fd.get(k);
    if (k === 'likelihood' || k === 'impact') v = Math.max(1, Math.min(5, +v || 1));
    if (req && !String(v).trim()) vals._missing = true;
    vals[k] = v;
  });
  if (vals._missing) return toast('Complete the required fields.', 'err');
  delete vals._missing;
  const ws = vals.ws || (it && it.ws);
  if (ws && !isOversight(u) && !(wsOf(u) || []).includes(ws)) return toast('You can only raise items in your own workstream.', 'err');
  if (isOversight(u)) vals.visibleToDevs = ws === 'S' && !!fd.get('visibleToDevs');
  const before = it ? Object.assign({}, it) : null;
  if (!it) { it = { id: uid(reg.slice(0, 2)), createdBy: u.id }; S[cfg.key].push(it); }
  Object.assign(it, vals);
  if (reg === 'changes') {
    it.status = ['Approved', 'Rejected'].includes(it.decision) ? it.decision : it.recommendation ? 'Recommended' : 'Under assessment';
    if (before && before.decision !== it.decision && it.decision !== 'Pending') {
      notify([it.requestedBy, it.createdBy].concat(usersWith('BDIH_LEAD'), devLeads(it.ws)), 'Change request decided', `Change request ${it.decision.toLowerCase()}: ${it.title}`, { ws: it.ws, visibleToDevs: it.visibleToDevs, link: '#/registers?tab=changes' });
    }
  }
  audit(reg + (before ? '.update' : '.create'), reg, it.id, before, vals);
  commit('Saved.');
};

/* ---------- Editable project plan (Administration) ---------- */

function setPreds(a, text) {
  const S = St(), list = visActs(me());
  const want = [];
  for (const part of String(text).split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)([+-]\d+)?$/);
    if (!m) return 'Write predecessors as activity numbers with an optional lag, for example "4, 7+2".';
    const p = list[+m[1] - 1];
    if (!p) return 'There is no activity number ' + m[1] + '.';
    if (p.id === a.id) return 'An activity cannot depend on itself.';
    want.push({ from: p.id, lag: m[2] ? +m[2] : 0 });
  }
  if (want.length > 5) return 'An activity can have at most five predecessors.';
  const old = S.links.filter(l => l.to === a.id);
  S.links = S.links.filter(l => l.to !== a.id);
  runSchedule(S);
  for (const w of want) {
    const cyc = findCycle(S, w.from, a.id);
    if (cyc) {
      S.links = S.links.filter(l => l.to !== a.id).concat(old);
      return 'Rejected: that creates a circular dependency through ' + cyc.map(id => actOf(id).name).concat(a.name).join(' then ') + '.';
    }
    S.links.push({ id: uid('l'), from: w.from, to: a.id, type: 'FS', lag: w.lag });
    runSchedule(S);
  }
  audit('activity.predecessors', 'activity', a.id, old.map(l => l.from), want);
  return null;
}
CHG.planCell = el => {
  const u = me(), a = actOf(el.dataset.id), k = el.dataset.k;
  if (!a) return;
  if (k === 'pct') {
    if (!can.progress(u, a)) return toast('You cannot update progress on this activity.', 'err');
    const pct = Math.round(clamp(el.value));
    hist(a, 'pct', a.pct, pct, 'Plan grid');
    audit('activity.progress', 'activity', a.id, { pct: a.pct }, { pct });
    a.pct = pct;
    if (pct > 0 && !a.actualStart) a.actualStart = D.today();
    if (pct > 0 && a.status === 'Not started') a.status = 'In progress';
    return commit('Saved.');
  }
  if (!can.editPlan(u)) return toast('You cannot edit the plan.', 'err');
  if (k === 'preds') { const err = setPreds(a, el.value); if (err) { toast(err, 'err'); return commit(); } return commit('Predecessors saved. Plan rescheduled.'); }
  let v = el.value;
  if (k === 'name' && !v.trim()) return toast('An activity needs a name.', 'err');
  if (k === 'duration') v = Math.max(1, Math.min(400, Math.round(+v || 1)));
  if (k === 'fixedStart' || k === 'lead') v = v || null;
  if (k === 'ws' && v !== 'S') a.visibleToDevs = false;
  if (k === 'type' && v === 'Review' && !a.reviewStage) a.reviewStage = 'BDIH';
  if (String(a[k] ?? '') === String(v ?? '')) return;
  hist(a, k, a[k], v, 'Plan grid');
  audit('activity.update', 'activity', a.id, { [k]: a[k] }, { [k]: v });
  a[k] = v;
  commit('Saved. Plan rescheduled.');
};

  if (S.holidays.some(h => h.date === d)) return toast('That date is already a holiday.', 'err');
  S.holidays.push({ date: d, reason: fd.get('reason').trim() });
  audit('calendar.holiday.add', 'closure_days', d);
  commit('Holiday added. Schedule updated.');
};
ACT.removeHoliday = el => { const S = St(); S.holidays = S.holidays.filter(h => h.date !== el.dataset.d); audit('calendar.holiday.remove', 'closure_days', el.dataset.d); commit('Holiday removed. Schedule updated.'); };

/* ---------- Notifications ---------- */

ACT.readAll = () => { St().notifications.filter(n => n.user === me().id).forEach(n => { n.read = n.read || D.now(); }); commit(); };
ACT.openNote = el => {
  const n = St().notifications.find(x => x.id === el.dataset.id);
  if (n && !Sess.readOnly) { n.read = n.read || D.now(); Store.save(); }
  location.hash = n && n.link ? n.link : '#/notifications';
  render();
};

// Timers, reminders and escalations raised once each (FR-REV-07, FR-WKR-03, FR-MTG-02, FR-RSK-05)
function runChecks() {
  const S = St(), cal = S._cal, today = D.today(), ti = cal.floor(today);
  let changed = false;
  const once = k => { if (S.flags[k]) return false; S.flags[k] = 1; changed = true; return true; };
  S.reviews.filter(r => !r.decidedAt).forEach(r => {
    const s = S.submissions.find(x => x.id === r.submissionId), a = s && actOf(s.activityId);
    if (!a) return;
    const left = cal.ceil(r.due) - ti, ent = Object.assign(entOf(a), { link: '#/submissions?tab=' + r.stage.toLowerCase() });
    if (left === 1 && once('due1:' + r.id)) notify([r.reviewer], 'Review due tomorrow', `${r.stage} review due tomorrow: ${a.name}`, ent);
    if (left < 0 && once('over:' + r.id)) notify([r.reviewer].concat(usersWith('BDIH_LEAD'), r.stage === 'BOCRA' ? usersWith('BOCRA_REP') : []), 'Review overdue', `${r.stage} review overdue: ${a.name} (due ${D.nice(r.due)})`, ent);
  });
  ['A', 'B'].forEach(ws => weeklyStatus(ws).forEach(w => {
    if (w.status === 'Late' && once('wk:' + ws + w.we)) {
      notify(devLeads(ws), 'Weekly report overdue', `Weekly report overdue: week ending ${D.nice(w.we)}`, { ws, link: '#/weekly' });
      notify(usersWith('BDIH_LEAD'), 'Weekly report overdue', `${wsName(ws)} weekly report overdue: week ending ${D.nice(w.we)}`, { ws, link: '#/weekly?ws=' + ws });
    }
  }));
  S.actions.filter(x => x.status !== 'Done' && x.due <= today).forEach(x => { if (once('act:' + x.id)) notify([x.owner], 'Action due', 'Action due: ' + x.text, { ws: x.ws, visibleToDevs: x.visibleToDevs, link: '#/tasks' }); });
  S.activities.filter(a => !a.deleted && health(a, ti) === 'Late').forEach(a => { if (once('late:' + a.id)) notify([resUser(a.lead)], 'Activity late', 'Activity late: ' + a.name, entOf(a)); });
  [['risks', 'due'], ['issues', 'target']].forEach(([k, f]) => S[k].forEach(it => {
    if (['Closed', 'Resolved'].includes(it.status) || !it[f]) return;
    const over = ti - cal.ceil(it[f]);
    if (over <= 0) return;
    const lvl = Math.floor((over - 1) / 3);
    if (once('esc:' + it.id + ':' + lvl)) {
      const to = lvl === 0 ? (it.ws === 'S' ? usersWith('BDIH_LEAD') : devLeads(it.ws)) : lvl === 1 ? usersWith('BDIH_LEAD') : usersWith('BOCRA_REP', 'BDIH_LEAD');
      notify(to.concat([it.owner]), 'Escalation', `Escalated (${k.slice(0, -1)} past target): ${it.title}`, { ws: it.ws, visibleToDevs: it.visibleToDevs, link: '#/registers?tab=' + k });
    }
  }));
  if (changed) Store.save();
}

/* ---------- Boot ---------- */

Store.load();
St()._errors = runSchedule(St());
loadSess();
if (Sess.userId && !Sess.period) Sess.period = defaultPeriod();
if (Sess.userId) runChecks();
render();
probeLogos(() => { if (Object.values(LOGO_FILES).some(Boolean)) render(); });
setInterval(() => { if (Sess.userId) runChecks(); }, 5 * 60e3);

</script>
<script>
/* js/extras.js */
'use strict';
/* Plan phases that collapse, Add deliverable, daily download limit and download log,
   several leads per developer team. Loaded after app.js. */

/* ---------- Collapsible phases ---------- */

function phaseCollapsed(ph) { return !!(Sess && Sess.collapsed && Sess.collapsed[ph]); }

// Rows grouped under a phase header that collapses; rowFn renders one activity row
function phaseRows(list, ncols, rowFn) {
  const i = sdi(), out = [];
  const phases = phaseKeys().concat([...new Set(list.map(a => a.phase))].filter(p => !phaseKeys().includes(p)));
  phases.forEach(ph => {
    const acts = list.filter(a => a.phase === ph);
    if (!acts.length) return;
    const w = weighted(acts, i), c = phaseCollapsed(ph);
    const late = acts.filter(a => health(a, i) === 'Late').length;
    const ms = acts.filter(a => a.type === 'Milestone').sort((a, b) => b._fi - a._fi)[0];
    out.push(`<tr class="phase-row"><td colspan="${ncols}"><div class="phase-h">
      <button class="phase-tog" data-act="togglePhase" data-ph="${esc(ph)}" aria-expanded="${!c}"><span class="chev" aria-hidden="true"></span>${esc(phaseName(ph) || ph)}</button>
      <span class="ph-meta">${acts.length} activities, ${pc(w.actual)} done of ${pc(w.planned)} planned${late ? `, <span class="bad">${late} late</span>` : ''}${ms ? `, ends ${D.short(ms.finish)}` : ''}</span>
      <span class="ph-bar">${bar(w.actual, w.planned)}</span></div></td></tr>`);
    if (!c) acts.forEach(a => out.push(rowFn(a)));
  });
  return out;
}
ACT.togglePhase = el => { Sess.collapsed = Sess.collapsed || {}; Sess.collapsed[el.dataset.ph] = !Sess.collapsed[el.dataset.ph]; saveSess(); render(); };
ACT.phasesAll = el => { Sess.collapsed = {}; if (el.dataset.v === '1') phaseKeys().forEach(p => { Sess.collapsed[p] = true; }); saveSess(); render(); };
['togglePhase', 'phasesAll'].forEach(k => SAFE.add(k));

/* ---------- Add a deliverable from the plan ---------- */

ACT.addDeliverable = () => {
  const u = me(), S = St();
  if (!can.editPlan(u)) return toast('Only the plan editors can add deliverables.', 'err');
  const acts = visActs(u);
  modal('Add deliverable', `<form data-form="addDeliverable" class="fgrid">
   ${fld('Deliverable name', inp('name', '', 'text', 'required maxlength="160" placeholder="For example: Accessibility audit report"'), 'span2')}
   ${fld('Reference', inp('ref', '', 'text', 'required maxlength="20" placeholder="D8 or DEV-A"'))}
   ${fld('Workstream', sel('ws', S.workstreams.map(w => [w.id, w.name]), 'A', 'data-change="dlvWs"'))}
   ${fld('Phase', sel('phase', phaseKeys(), 'Phase 2'))}
   ${fld('Duration (business days)', inp('duration', 5, 'number', 'min="1" max="200" required'))}
   ${fld('Lead resource', sel('lead', resOpts(), 'R7'))}
   ${fld('Document category', sel('docCat', S.lookups.docCategories, 'Report'))}
   ${fld('Starts after (predecessor)', sel('pred', [['', 'Project start']].concat(acts.map(a => [a.id, num(a) + '. ' + a.name]))), 'span2')}
   <label class="chk span2"><input type="checkbox" name="bdih" checked> BDIH reviews it before BOCRA (usual for developer deliverables)</label>
   <div class="span2"><button class="btn">Add to plan</button></div></form>`, true);
};
CHG.dlvWs = el => { const f = el.form; f.bdih.checked = el.value !== 'S'; f.lead.value = el.value === 'A' ? 'R7' : el.value === 'B' ? 'R8' : 'R1'; };
FORM.addDeliverable = fd => {
  const u = me(), S = St();
  if (!can.editPlan(u)) return toast('Not allowed.', 'err');
  const ws = fd.get('ws'), name = String(fd.get('name')).trim(), ref = String(fd.get('ref')).trim(), phase = fd.get('phase');
  if (!name || !ref) return toast('Give the deliverable a name and reference.', 'err');
  const pred = fd.get('pred') && actOf(fd.get('pred'));
  const mk = o => Object.assign({ id: uid('a'), key: null, ws, phase, pct: 0, status: 'Not started', actualStart: null, actualFinish: null, fixedStart: null, notes: '', visibleToDevs: false, deliverableRef: '', reviewStage: null, submittable: false, indent: 0, docCat: 'Other', lead: null, support: null }, o);
  const d = mk({ name, type: 'Task', duration: Math.max(1, +fd.get('duration') || 1), lead: fd.get('lead') || null, deliverableRef: ref, submittable: true, docCat: fd.get('docCat') });
  const chain = [d];
  let last = d;
  const links = [];
  if (pred) links.push({ id: uid('l'), from: pred.id, to: d.id, type: 'FS', lag: 0 });
  if (fd.get('bdih')) {
    const b = mk({ name: 'BDIH review: ' + name, type: 'Review', reviewStage: 'BDIH', lead: 'R4', support: 'R3', indent: 1, forId: d.id, duration: 1 });
    d.bdihReviewId = b.id; chain.push(b); links.push({ id: uid('l'), from: last.id, to: b.id, type: 'FS', lag: 0 }); last = b;
  }
  const o = mk({ name: 'BOCRA review: ' + name, type: 'Review', reviewStage: 'BOCRA', lead: 'R5', indent: 1, forId: d.id, duration: 1 });
  d.bocraReviewId = o.id; chain.push(o); links.push({ id: uid('l'), from: last.id, to: o.id, type: 'FS', lag: 0 });
  // Place after the predecessor, or after the last activity of the same workstream
  let k = pred ? S.activities.indexOf(pred) : -1;
  if (k < 0) S.activities.forEach((a, j) => { if (a.ws === ws && !a.deleted) k = j; });
  S.activities.splice(k + 1, 0, ...chain);
  S.links.push(...links);
  S.deliverables.push({ id: uid('dl'), ref, name, phase, owner: ws === 'A' ? 'DEVA' : ws === 'B' ? 'DEVB' : 'BDIH', ws, activityId: d.id });
  audit('deliverable.create', 'deliverable', d.id, null, { ref, name, ws, reviews: chain.length - 1 });
  commit(ref + ' ' + name + ' added with its review steps.');
};

/* ---------- Daily download limit and download log ---------- */

const DL_RE = /^(document\.download|report\.generate|report\.download|export\.)/;
const dlLimit = () => Math.max(0, +St().settings.dailyDownloadLimit || 0);
const downloadsToday = uid => { const t = D.today(); return St().audit.filter(x => x.user === uid && DL_RE.test(x.action) && D.dateOf(x.at) === t).length; };

function downloadBanner(u) {
  const lim = dlLimit();
  if (!lim) return '';
  const n = downloadsToday(Sess.userId);
  return `<p class="dl-quota ${n >= lim ? 'bad' : ''}">Downloads today: <strong>${n} of ${lim}</strong>. The count resets at midnight.</p>`;
}

['download', 'reportPdf', 'reportWord', 'archivedReport', 'archivedWord', 'exportSchedule', 'exportMsp', 'exportCustom', 'exportUsers', 'exportAudit'].forEach(k => {
  const f = ACT[k];
  ACT[k] = (el, e) => {
    const lim = dlLimit(), n = downloadsToday(Sess.userId);
    if (lim && n >= lim) return toast(`You have reached today's limit of ${lim} downloads. It resets at midnight; an administrator can change the limit in Settings.`, 'err');
    const r = f(el, e);
    if (lim && lim - n - 1 <= 5) toast(`${Math.max(0, lim - n - 1)} downloads left today.`);
    return r;
  };
});

function dlDescribe(x) {
  const a = x.after || {};
  if (x.action === 'document.download') {
    const d = St().documents.find(y => y.id === x.entityId);
    return [d ? d.title + (a.version ? ' (v' + a.version + ')' : '') : 'Document', d ? (d.entityType === 'bank' ? 'Document bank' : d.category) : '', 'File'];
  }
  if (x.action === 'report.generate') return ['Progress report: ' + (a.scope === 'combined' ? 'combined' : wsName(a.scope || '')) + (a.period ? ', ' + D.short(a.period.start) + ' to ' + D.short(a.period.end) : ''), 'Report', (a.format || '').toUpperCase()];
  if (x.action === 'report.download') { const r = St().reports.find(y => y.id === x.entityId); return ['Monthly Progress Report ' + (r ? r.month : ''), 'Official report', 'PDF or Word']; }
  const kind = x.action.split('.')[1];
  return [{ schedule: 'Project plan export', msproject: 'MS Project export', custom: 'Custom report: ' + ((DATASETS[a.ds] || {}).label || ''), users: 'Users and access export', audit: 'Audit log export' }[kind] || x.action, 'Export', (a.format || 'CSV').toUpperCase()];
}

function downloadLogView(u, q) {
  const S = St();
  let rows = S.audit.filter(x => DL_RE.test(x.action)).sort((a, b) => a.at < b.at ? 1 : -1);
  if (q.who) rows = rows.filter(x => x.user === q.who);
  if (q.org) rows = rows.filter(x => (userOf(x.user) || {}).org === q.org);
  if (q.day) rows = rows.filter(x => D.dateOf(x.at) === q.day);
  const people = [...new Set(S.audit.filter(x => DL_RE.test(x.action)).map(x => x.user))].filter(Boolean);
  const today = D.today(), lim = dlLimit();
  const top = people.map(id => [id, downloadsToday(id)]).filter(p => p[1]).sort((a, b) => b[1] - a[1]);
  return `<div class="filters">
    <label class="f inline"><span>Person</span>${sel('who', [['', 'Everyone']].concat(people.map(id => [id, uname(id)])), q.who || '', 'data-change="qset" data-k="who"')}</label>
    <label class="f inline"><span>Organisation</span>${sel('org', [['', 'All']].concat(S.orgs.map(o => [o.id, o.name])), q.org || '', 'data-change="qset" data-k="org"')}</label>
    <label class="f inline"><span>Day</span><input type="date" value="${esc(q.day || '')}" data-change="qset" data-k="day"></label></div>
   <div class="grid g2r"><div class="card flush">${table(['When', 'Who', 'Organisation', 'What', 'Area', 'Format'], rows.slice(0, 400).map(x => { const [what, area, fmt] = dlDescribe(x); const p = userOf(x.user) || {}; return tr([D.stamp(x.at), esc(uname(x.user)), esc(orgName(p.org || '').split(' ')[0] || ''), esc(what), esc(area), esc(fmt)]); }), 'No downloads recorded.')}</div>
   <section class="card"><h2>Today</h2>${lim ? `<p class="muted">Limit: ${lim} downloads per person per day.</p>` : '<p class="muted">No daily limit is set.</p>'}
    ${top.length ? `<ul class="alist">${top.map(([id, n]) => `<li><span>${esc(uname(id))}</span> <strong class="${lim && n >= lim ? 'bad' : ''}">${n}${lim ? ' of ' + lim : ''}</strong></li>`).join('')}</ul>` : '<p class="empty">No downloads today.</p>'}
</section></div>`;
}

/* ---------- Several leads per developer team, with the change audited ---------- */

ACT.toggleLead = el => {
  const S = St(), x = userOf(el.dataset.id);
  if (!can.admin(me())) return toast('Only administrators change roles.', 'err');
  const isLead = hasRole(x, 'DEV_LEAD');
  const leads = S.users.filter(y => y.active && y.org === x.org && hasRole(y, 'DEV_LEAD'));
  if (isLead && leads.length <= 1) return toast('A developer team needs at least one lead.', 'err');
  const before = { role: x.role, extraRoles: (x.extraRoles || []).slice() };
  if (isLead) {
    x.extraRoles = (x.extraRoles || []).filter(r => r !== 'DEV_LEAD');
    if (x.role === 'DEV_LEAD') x.role = 'DEV_MEMBER';
  } else {
    x.extraRoles = [...new Set((x.extraRoles || []).concat('DEV_LEAD'))].filter(r => r !== x.role);
  }
  audit(isLead ? 'user.role.revoke' : 'user.role.grant', 'user', x.id, before, { role: x.role, extraRoles: x.extraRoles, changed: 'DEV_LEAD' });
  notify([x.id], 'Account change', isLead ? 'You are no longer a Developer Lead' : 'You are now a Developer Lead');
  commit(x.fullName + (isLead ? ' is no longer a lead.' : ' is now a Developer Lead.'));
};

ACT.userHistory = el => {
  const x = userOf(el.dataset.id);
  const label = a => ({ 'user.create': 'Account created', 'user.update': 'Details or roles changed', 'user.role.grant': 'Role granted', 'user.role.revoke': 'Role removed', 'user.passwordReset': 'Password reset', 'user.deactivate': 'Deactivated', 'user.reactivate': 'Reactivated', 'user.unlock': 'Unlocked', 'login': 'Signed in', 'login.failed': 'Failed sign-in', 'account.locked': 'Locked after failed sign-ins', 'password.change': 'Changed own password', 'impersonate.start': 'Viewed as by an administrator' }[a] || a);
  const rows = St().audit.filter(a => a.entityId === x.id && (/^(user|login|account|password|impersonate)/.test(a.action))).sort((a, b) => a.at < b.at ? 1 : -1);
  const detail = a => a.after && (a.after.changed || a.after.role) ? esc([a.after.changed ? roleName(a.after.changed) : '', a.after.role ? 'primary ' + roleName(a.after.role) : '', (a.after.extraRoles || []).length ? 'also ' + a.after.extraRoles.map(r => roleName(r)).join(', ') : ''].filter(Boolean).join('; ')) : '';
  modal('History: ' + x.fullName, `<p class="muted">Current roles: ${esc(roleLabel(x))}</p>${table(['When', 'Event', 'By', 'Detail'], rows.map(a => tr([D.stamp(a.at), esc(label(a.action)), esc(a.user ? uname(a.user) : 'System'), detail(a)])), 'No history yet.')}`, true);
};
SAFE.add('userHistory');

/* ---------- Organisation names: Developer A and B can carry the real company names ---------- */

ACT.orgModal = el => {
  const o = St().orgs.find(x => x.id === el.dataset.id);
  if (!can.admin(me())) return toast('Only administrators edit organisations.', 'err');
  modal('Edit organisation', `<form data-form="org" class="fgrid"><input type="hidden" name="id" value="${o.id}">
   ${fld('Registered name', inp('name', o.name, 'text', 'required maxlength="120"'), 'span2')}
   ${fld('Contact person or address (optional)', inp('contact', o.contact || '', 'text', 'maxlength="160"'), 'span2')}
   <p class="small muted span2">${o.type === 'Developer' ? `This is the company building the ${esc(wsName(o.id === 'DEVA' ? 'A' : 'B'))}. Its name appears on dashboards, boards, reports and invoices. Its workstream, users and data are unchanged.` : 'The name appears throughout the tracker.'}</p>
   <div class="span2"><button class="btn">Save</button></div></form>`);
};
FORM.org = fd => {
  const S = St(), o = S.orgs.find(x => x.id === fd.get('id')), name = String(fd.get('name')).trim();
  if (!can.admin(me())) return toast('Not allowed.', 'err');
  if (!name) return toast('Give the organisation a name.', 'err');
  if (S.orgs.some(x => x.id !== o.id && x.name.toLowerCase() === name.toLowerCase())) return toast('Another organisation already has that name.', 'err');
  const before = { name: o.name, contact: o.contact || '' };
  // Keep the matching plan resource in step (for example the "Developer A" resource)
  S.resources.filter(r => r.org === o.id && r.name === o.name).forEach(r => { r.name = name; });
  o.name = name; o.contact = String(fd.get('contact') || '').trim();
  audit('organisation.update', 'organisation', o.id, before, { name: o.name, contact: o.contact });
  commit('Organisation renamed to ' + name + '.');
};

/* ---------- Administration: editable lists, role names, workstreams ---------- */

// [key, title, current values, rule]; rules protect values the system relies on
const ADMIN_LISTS = () => [
  ['phases', 'Project phases', phaseKeys().map(k => k + ' = ' + phaseName(k)), 'One per line as "key = display name". Keys already used by activities cannot be removed.'],
  ['ticketStatuses', 'Ticket board columns', ticketStatuses(), 'Left to right. "Done" must stay; columns with tickets in them cannot be removed.'],
  ['ticketTypes', 'Ticket types', ticketTypes(), 'Types already used by tickets cannot be removed.'],
  ['ticketPriorities', 'Ticket priorities', ticketPriorities(), 'Highest first. Priorities already used cannot be removed.'],
  ['docCategories', 'Document categories', lists().docCategories || [], ''],
  ['bankCategories', 'Document bank categories', lists().bankCategories || [], ''],
  ['checklist', 'Review checklist', lists().checklist || [], 'Shown to BDIH reviewers on every submission.'],
  ['forums', 'Meeting forums', lists().forums || [], '']
];

function adminLists(u, A, prot) {
  return `
   <div class="grid g2">${ADMIN_LISTS().map(([k, t, vals, rule]) => `<section class="card"><h2>${esc(t)}</h2>
    <form data-form="lookup"><input type="hidden" name="k" value="${k}">${fld('One value per line', `<textarea name="v" rows="${Math.min(10, Math.max(4, vals.length + 1))}" ${A ? '' : 'disabled'}>${esc(vals.join('\n'))}</textarea>`)}
    ${rule ? `<p class="small muted">${esc(rule)}</p>` : ''}${A ? '<button class="btn sm">Save list</button>' : ''}</form></section>`).join('')}
    ${prot('Activity types', TYPES)}${prot('Activity statuses', STATUSES)}${prot('Health ratings', HEALTH)}${prot('Invoice statuses', INVOICE_STATUSES)}</div>`;
}

// Replaces the simple list save with checks for values in use
FORM.lookup = fd => {
  const S = St(), k = fd.get('k');
  if (!can.admin(me())) return toast('Only administrators edit lists.', 'err');
  const vals = [...new Set(String(fd.get('v')).split('\n').map(s => s.trim()).filter(Boolean))];
  if (!vals.length) return toast('A list needs at least one value.', 'err');
  const missing = used => [...new Set(used)].filter(x => x && !vals.includes(x));
  let store = vals, gone = [];
  if (k === 'phases') {
    const parsed = vals.map(l => { const m = l.split('='); return { key: m[0].trim(), name: (m.slice(1).join('=').trim() || m[0].trim()) }; });
    const keys = parsed.map(p => p.key);
    if (new Set(keys).size !== keys.length) return toast('Each phase key must be unique.', 'err');
    gone = [...new Set(S.activities.filter(a => !a.deleted).map(a => a.phase))].filter(x => !keys.includes(x));
    store = parsed;
  } else if (k === 'ticketStatuses') {
    if (!vals.includes('Done')) return toast('The "Done" column must stay.', 'err');
    gone = missing(S.tickets.map(t => t.status));
  } else if (k === 'ticketTypes') gone = missing(S.tickets.map(t => t.type));
  else if (k === 'ticketPriorities') gone = missing(S.tickets.map(t => t.priority));
  else if (k === 'docCategories') gone = missing(S.documents.filter(d => d.entityType !== 'bank').map(d => d.category));
  else if (k === 'bankCategories') gone = missing(S.documents.filter(d => d.entityType === 'bank').map(d => d.category));
  if (gone.length) return toast('Still in use, so it cannot be removed: ' + gone.join(', ') + '.', 'err');
  const before = S.lookups[k];
  S.lookups[k] = store;
  audit('lookup.update', 'lookups', k, before || null, store);
  commit('List saved.');
};

function adminRoleNames(u) {
  const A = can.admin(u) && !RO();
  return `<section class="card"><h2>Role names</h2>
   <form data-form="roleNames" class="fgrid">${Object.keys(ROLES).map(r => fld(roleName(r) === ROLES[r] ? esc(ROLES[r]) : esc(roleName(r)) + ' <span class="muted">(originally ' + esc(ROLES[r]) + ')</span>', inp('r_' + r, roleName(r), 'text', (A ? '' : 'disabled') + ' maxlength="60" required'))).join('')}
   ${A ? '<div class="span2 btns"><button class="btn sm">Save role names</button><button type="button" class="btn sm ghost" data-act="resetRoleNames">Restore original names</button></div>' : ''}</form></section>`;
}
FORM.roleNames = fd => {
  const S = St();
  if (!can.admin(me())) return toast('Not allowed.', 'err');
  const names = {};
  Object.keys(ROLES).forEach(r => { const v = String(fd.get('r_' + r) || '').trim(); if (v && v !== ROLES[r]) names[r] = v; });
  const all = Object.keys(ROLES).map(r => (names[r] || ROLES[r]).toLowerCase());
  if (new Set(all).size !== all.length) return toast('Two roles cannot have the same name.', 'err');
  audit('roles.rename', 'roles', null, S.roleNames || null, names);
  S.roleNames = names;
  commit('Role names saved.');
};

/* ---------- Administrator overrides on records ---------- */

ACT.adminDeleteTicket = el => {
  const S = St(), t = S.tickets.find(x => x.id === el.dataset.id);

ACT.adminDeleteReg = el => {

};
ACT.adminDeleteMeeting = el => {
  const S = St(), m = S.meetings.find(x => x.id === el.dataset.id);
  if (!can.admin(me())) return;
  if (!confirm('Delete the meeting "' + m.title + '" and its action items?')) return;
  S.meetings = S.meetings.filter(x => x !== m);
  S.actions = S.actions.filter(x => x.meetingId !== m.id);
  audit('meeting.delete', 'meeting', m.id, { title: m.title }, null);
  go('meetings');
  commit('Meeting deleted.');
};

/* ---------- Labels: the administrator renames any button, tab or menu item ---------- */

const LABEL_SEL = 'button, a.btn, .side nav a, .tabs a, .board-tabs a span, .chip, legend, .bcol header h2';
const seenLabels = new Set();

// Swap the first text of each control for the administrator's label; remember what we saw
function applyLabels(root) {
  if (!root || !Store.state) return;
  const L = St().labels || {};
  root.querySelectorAll(LABEL_SEL).forEach(el => {
    const node = [...el.childNodes].find(n => n.nodeType === 3 && n.nodeValue.trim());
    if (!node) return;
    const txt = node.nodeValue.trim();
    const orig = el.dataset.label || txt;
    if (!el.dataset.label) el.dataset.label = orig;
    if (orig.length < 60 && !/^\d/.test(orig)) seenLabels.add(orig);
    if (L[orig]) node.nodeValue = node.nodeValue.replace(txt, L[orig]);
  });
}
const _render = render;
render = function () { _render(); applyLabels(document.getElementById('app')); };
const _modal = modal;
modal = function (title, html, wide) {
  const L = St().labels || {};
  _modal(L[title] || title, html, wide);
  applyLabels(document.querySelector('.modal-bg'));
};

function adminLabels(u, q) {
  const A = can.admin(u) && !RO(), L = St().labels || {};
  const all = [...new Set(KNOWN_LABELS.concat([...seenLabels], Object.keys(L)))].sort((a, b) => a.localeCompare(b));
  const list = q.lq ? all.filter(x => (x + ' ' + (L[x] || '')).toLowerCase().includes(q.lq.toLowerCase())) : all;
  return `
   <div class="filters"><label class="f inline grow"><span>Find a label</span><input type="search" value="${esc(q.lq || '')}" data-change="qset" data-k="lq" placeholder="For example: Submit"></label>
    <span class="muted">${Object.keys(L).length} renamed</span></div>
   <form data-form="labels"><div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>Original</th><th>Shown as</th></tr></thead><tbody>
   ${list.map(x => `<tr><td>${esc(x)}</td><td><input name="l::${esc(x)}" value="${esc(L[x] || '')}" placeholder="${esc(x)}" maxlength="60" ${A ? '' : 'disabled'} aria-label="New label for ${esc(x)}"></td></tr>`).join('')}
   </tbody></table></div></div>${A ? '<div class="btns"><button class="btn">Save labels</button><button type="button" class="btn ghost" data-act="resetLabels">Restore all original labels</button></div>' : ''}</form>`;
}
FORM.labels = fd => {
  const S = St();
  if (!can.admin(me())) return toast('Not allowed.', 'err');
  const next = Object.assign({}, S.labels || {});
  for (const [k, v] of fd.entries()) {
    if (!k.startsWith('l::')) continue;
    const orig = k.slice(3), val = String(v).trim();
    if (val && val !== orig) next[orig] = val; else delete next[orig];
  }
  audit('labels.update', 'ui_labels', null, S.labels || null, next);
  S.labels = next;
  commit('Labels saved.');
};
ACT.resetLabels = () => {
  if (!confirm('Restore every original label?')) return;
  audit('labels.reset', 'ui_labels', null, St().labels || null, null);
  St().labels = {};
  commit('Original labels restored.');
};

/* ---------- Cloudflare Turnstile on sign-in (site key set in Administration, Settings) ---------- */

var DEFAULT_TURNSTILE_KEY = '0x4AAAAAAFvlUC69yGzxrwc-';
function tsCfg() { return { key: cfg().turnstileSiteKey || DEFAULT_TURNSTILE_KEY || '0x4AAAAAAFvlUC69yGzxrwc-', on: cfg().turnstileEnabled !== false }; }
// Turnstile only works on hostnames added in the Cloudflare dashboard; local test copies may not be
const devHost = () => location.protocol === 'file:' || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
let tsState = { token: null, failed: false, widget: null };

function tsNote(msg) { const n = document.getElementById('ts-note'); if (n) n.textContent = msg; }
function loadTurnstile(cb) {
  if (window.turnstile) return cb();
  let s = document.getElementById('ts-api');
  if (!s) {
    s = document.createElement('script');
    s.id = 'ts-api';
    s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    s.async = true;
    s.onerror = () => { tsState.failed = true; tsNote(devHost() ? '' : 'The security check could not load. Check your connection and reload the page.'); };
    document.head.appendChild(s);
  }
  s.addEventListener('load', cb, { once: true });
}
function mountTurnstile() {
  const box = document.getElementById('cf-ts');
  if (!box || !tsCfg().on) return;
  tsState = { token: null, failed: false, widget: null };
  loadTurnstile(() => {
    if (!document.getElementById('cf-ts') || !window.turnstile) return;
    tsState.widget = window.turnstile.render('#cf-ts', {
      sitekey: tsCfg().key, theme: 'light', size: 'flexible',
      callback: t => { tsState.token = t; tsNote(''); },
      'expired-callback': () => { tsState.token = null; tsNote('The security check expired. Please tick it again.'); },
      'error-callback': () => {
        tsState.failed = true;
        tsNote(devHost() ? '' : 'The security check failed. Reload the page and try again.');
        return true;
      }
    });
  });
}
const _renderTs = render;
render = function () { _renderTs(); if (!Sess || !Sess.userId) mountTurnstile(); };

// Sign-in needs a Turnstile token; the login Edge Function verifies it with Cloudflare in production
const _login = FORM.login;
FORM.login = (fd, f) => {
  if (tsCfg().on && !tsState.token && !(tsState.failed && devHost())) return toast('Please complete the security check first.', 'err');
  Ctx.turnstileToken = tsState.token;
  if (window.turnstile && tsState.widget != null) { try { window.turnstile.reset(tsState.widget); } catch (e) { /* widget gone */ } }
  tsState.token = null;
  return _login(fd, f);
};

<script>
/* js/tickets.js */
'use strict';
/* Developer tickets: a Jira-style board per developer workstream. Each developer sees only its
   own board; BDIH and BOCRA see both. Loaded after app.js. */

// Board columns, types and priorities come from Administration, Lists ("Done" is fixed)
const ticketStatuses = () => lists().ticketStatuses || ['To do', 'In progress', 'In review', 'Blocked', 'Done'];
const ticketTypes = () => lists().ticketTypes || ['Story', 'Task', 'Bug', 'UAT defect', 'Support request'];
const ticketPriorities = () => lists().ticketPriorities || ['Highest', 'High', 'Medium', 'Low'];
const ticketPrefix = ws => (St().workstreams.find(w => w.id === ws) || {}).ticketPrefix || ({ A: 'BOC', B: 'UAS' }[ws] || ws);

const ticketWsList = u => (isOversight(u) ? ['A', 'B'] : (wsOf(u) || []).filter(w => w !== 'S'));
const canSeeTicket = (u, t) => !!t && canSee(u, t.ws, false);
const canEditTicket = (u, t) => canSeeTicket(u, t) && hasPerm(u, 'ticket.manage') && !RO();
const canRaiseTicket = (u, ws) => hasPerm(u, 'ticket.create') && canSee(u, ws, false) && ws !== 'S' && !RO();
const assignees = ws => St().users.filter(x => x.active && canSee(x, ws, false) && (hasRole(x, 'DEV_LEAD', 'DEV_MEMBER') ? (wsOf(x) || []).includes(ws) : x.org === 'BDIH' && !isViewer(x)));
const prioIcon = p => `<span class="prio prio-${slug(p)}" title="${esc(p)} priority" aria-label="${esc(p)} priority"></span>`;
const typeTag = t => `<span class="ttype tt-${slug(t)}">${esc(t)}</span>`;

NAV.splice(NAV.findIndex(n => n.r === 'submissions') + 1, 0, { r: 'tickets', t: 'Tickets' });

function ticketCard(t) {
  const a = t.activityId && actOf(t.activityId);
  const over = t.due && t.status !== 'Done' && t.due < D.today();
  return `<article class="tcard" draggable="${canEditTicket(Ctx.u, t)}" data-ticket="${t.id}" tabindex="0" data-act="ticketOpen" data-id="${t.id}">
    <p class="tc-title">${esc(t.title)}</p>
    ${t.labels.length ? `<p class="tc-labels">${t.labels.map(l => `<span>${esc(l)}</span>`).join('')}</p>` : ''}
    <footer>${typeTag(t.type)} ${prioIcon(t.priority)} <span class="tc-key">${esc(t.key)}</span>
     ${t.estimate ? `<span class="tc-est" title="Estimate">${t.estimate}</span>` : ''}${t.comments.length ? `<span class="tc-c" title="Comments">${t.comments.length} comment${t.comments.length === 1 ? '' : 's'}</span>` : ''}
     ${over ? '<span class="timer over">Overdue</span>' : ''}<span class="av sm" title="${esc(uname(t.assignee))}">${esc(initialsOf(t.assignee))}</span></footer>
    ${a ? `<p class="tc-act">${esc(a.name)}</p>` : ''}</article>`;
}
function initialsOf(id) { const u = userOf(id); return u ? u.fullName.split(' ').map(x => x[0]).join('').slice(0, 2) : '?'; }

function filterTickets(list, q, u) {
  if (q.assignee === 'me') list = list.filter(t => t.assignee === u.id);
  else if (q.assignee) list = list.filter(t => t.assignee === q.assignee);
  if (q.type) list = list.filter(t => t.type === q.type);
  if (q.prio) list = list.filter(t => t.priority === q.prio);
  if (q.q) { const s = q.q.toLowerCase(); list = list.filter(t => (t.key + ' ' + t.title + ' ' + t.description + ' ' + t.labels.join(' ')).toLowerCase().includes(s)); }
  return list;
}

VIEWS.tickets = (p, q) => {
  const u = Ctx.u, S = St(), wss = ticketWsList(u);
  if (!wss.length) return notFound();
  const ws = wss.includes(q.ws) ? q.ws : wss[0];
  const view = q.view || 'board';
  const all = S.tickets.filter(t => t.ws === ws && canSeeTicket(u, t));
  const list = filterTickets(all, q, u);
  const href = o => '#/tickets?' + qs(Object.assign({}, q, o));
  const open = all.filter(t => t.status !== 'Done');
  const cur = q.id && S.tickets.find(t => t.id === q.id && canSeeTicket(u, t));
  const head = `<div class="page-h"><div><h1>Tickets</h1></div>
   ${canRaiseTicket(u, ws) ? `<div class="actions"><button class="btn" data-act="ticketNew" data-ws="${ws}">Create ticket</button></div>` : ''}</div>
   ${wss.length > 1 ? `<div class="board-tabs">${wss.map(w => `<a href="${href({ ws: w, id: '' })}" class="${w === ws ? 'on' : ''}">${wsLogo(w, 'bt-logo')}<span>${esc(wsName(w))}<small>${S.tickets.filter(t => t.ws === w && t.status !== 'Done').length} open</small></span></a>`).join('')}</div>` : ''}
   <div class="tstats"><span><strong>${open.length}</strong> open</span><span><strong>${open.filter(t => t.type === 'Bug' || t.type === 'UAT defect').length}</strong> bugs and defects</span><span><strong class="${open.filter(t => t.status === 'Blocked').length ? 'bad' : ''}">${open.filter(t => t.status === 'Blocked').length}</strong> blocked</span><span><strong>${all.filter(t => t.status === 'Done').length}</strong> done</span><span><strong>${open.reduce((n, t) => n + (+t.estimate || 0), 0)}</strong> points remaining</span></div>
   <div class="filters">
    ${tabs([['board', 'Board', href({ view: 'board' })], ['list', 'List', href({ view: 'list' })]], view)}
    <label class="f inline"><span>Assignee</span>${sel('assignee', [['', 'Anyone'], ['me', 'Me']].concat(assignees(ws).map(x => [x.id, x.fullName])), q.assignee || '', 'data-change="qset" data-k="assignee"')}</label>
    <label class="f inline"><span>Type</span>${sel('type', [['', 'All']].concat(ticketTypes()), q.type || '', 'data-change="qset" data-k="type"')}</label>
    <label class="f inline"><span>Priority</span>${sel('prio', [['', 'All']].concat(ticketPriorities()), q.prio || '', 'data-change="qset" data-k="prio"')}</label>
    <label class="f inline grow"><span>Search</span><input type="search" value="${esc(q.q || '')}" data-change="qset" data-k="q" placeholder="Key, title or label"></label></div>`;
  let body;
  if (view === 'list') {
    const order = t => ticketPriorities().indexOf(t.priority);
    body = `<div class="card flush">${table(['Key', 'Summary', 'Type', 'Priority', 'Status', 'Assignee', 'Due', 'Updated'], list.slice().sort((a, b) => ticketStatuses().indexOf(a.status) - ticketStatuses().indexOf(b.status) || order(a) - order(b)).map(t => tr([
      `<a href="${href({ id: t.id })}">${esc(t.key)}</a>`, `<a href="${href({ id: t.id })}">${esc(t.title)}</a>`, typeTag(t.type), prioIcon(t.priority) + ' ' + esc(t.priority), stb(t.status), esc(uname(t.assignee)), t.due ? D.nice(t.due) : '', D.stamp(t.updated)])), 'No tickets match.')}</div>`;
  } else {
    body = `<div class="board" role="list">${ticketStatuses().map(s => {
      const col = list.filter(t => t.status === s).sort((a, b) => ticketPriorities().indexOf(a.priority) - ticketPriorities().indexOf(b.priority));
      return `<section class="bcol bcol-${slug(s)}" data-status="${s}" role="listitem" aria-label="${s}"><header><h2>${s}</h2><span>${col.length}</span></header><div class="bcol-body">${col.map(ticketCard).join('') || '<p class="bcol-empty">No tickets</p>'}</div></section>`;
    }).join('')}</div>`;
  }
  return head + body + (cur ? ticketDetail(cur, u) : '');
};

function ticketDetail(t, u) {
  const S = St(), ed = canEditTicket(u, t), a = t.activityId && actOf(t.activityId);
  const docs = S.documents.filter(d => !d.deleted && d.entityType === 'ticket' && d.entityId === t.id && canSeeItem(u, d));
  const acts = visActs(u).filter(x => x.ws === t.ws);
  const canTalk = canSeeTicket(u, t) && !RO();
  const hName = f => ({ status: 'Status', assignee: 'Assignee', priority: 'Priority', due: 'Due', type: 'Type', title: 'Summary', created: 'Created', activityId: 'Linked activity', estimate: 'Estimate', description: 'Description', labels: 'Labels' }[f] || f);
  const hVal = (f, v) => f === 'assignee' ? uname(v) : f === 'activityId' ? ((actOf(v) || {}).name || 'None') : v;
  return `<section class="card tdetail" id="ticket">
   <div class="ph"><div><p class="crumb">${wsTag(t.ws)} <span class="tc-key">${esc(t.key)}</span> ${typeTag(t.type)}</p><h2>${esc(t.title)}</h2></div><div class="btns">${can.admin(u) && !RO() ? `<button class="btn ghost sm danger" data-act="adminDeleteTicket" data-id="${t.id}">Delete</button>` : ''}<a class="btn ghost sm" href="#/tickets?ws=${t.ws}">Close</a></div></div>
   <div class="tgrid"><div>
    ${ed ? `<form data-form="ticketEdit" class="fgrid"><input type="hidden" name="id" value="${t.id}">
      ${fld('Summary', inp('title', t.title, 'text', 'required maxlength="200"'), 'span2')}
      ${fld('Description', ta('description', t.description, 'rows="5"'), 'span2')}
      ${fld('Labels (comma separated)', inp('labels', t.labels.join(', ')))}${fld('Estimate (points)', inp('estimate', t.estimate, 'number', 'min="0" max="100"'))}
      <div class="span2"><button class="btn sm">Save changes</button></div></form>` : `<h3>Description</h3><p>${esc(t.description) || '<span class="muted">No description.</span>'}</p>${t.labels.length ? `<p class="tc-labels">${t.labels.map(l => `<span>${esc(l)}</span>`).join('')}</p>` : ''}`}
    <h3>Attachments</h3>${docs.length ? `<ul class="alist">${docs.map(d => `<li><button class="link" data-act="download" data-id="${d.id}">${esc(d.title)}</button> <span class="muted">v${d.versions.length}</span></li>`).join('')}</ul>` : '<p class="empty">None.</p>'}
    ${canTalk && (ed || hasPerm(u, 'ticket.create')) ? `<button class="btn sm ghost" data-act="uploadModal" data-entity="ticket" data-eid="${t.id}" data-ws="${t.ws}">Attach file</button>` : ''}
    <h3>Comments</h3>${t.comments.map(c => `<div class="comment"><strong>${esc(uname(c.by))}</strong> <span class="muted">${D.stamp(c.at)}</span><p>${esc(c.body)}</p></div>`).join('') || '<p class="empty">No comments yet.</p>'}
    ${canTalk ? `<form data-form="ticketComment"><input type="hidden" name="id" value="${t.id}">${fld('Add a comment', ta('body', '', 'required'))}<button class="btn sm">Comment</button></form>` : ''}
   </div>
   <aside class="tside">
    ${ed ? `<form data-form="ticketFields">
      <input type="hidden" name="id" value="${t.id}">
      ${fld('Status', sel('status', ticketStatuses(), t.status))}${fld('Assignee', sel('assignee', assignees(t.ws).map(x => [x.id, x.fullName]), t.assignee))}
      ${fld('Priority', sel('priority', ticketPriorities(), t.priority))}${fld('Type', sel('type', ticketTypes(), t.type))}
      ${fld('Due date', inp('due', t.due, 'date'))}${fld('Linked activity', sel('activityId', [['', 'None']].concat(acts.map(x => [x.id, num(x) + '. ' + x.name])), t.activityId || ''))}
      <button class="btn sm block">Update</button></form>`
    : `<dl class="kv one"><dt>Status</dt><dd>${stb(t.status)}</dd><dt>Assignee</dt><dd>${esc(uname(t.assignee))}</dd><dt>Priority</dt><dd>${prioIcon(t.priority)} ${esc(t.priority)}</dd><dt>Due</dt><dd>${t.due ? D.nice(t.due) : 'None'}</dd><dt>Linked activity</dt><dd>${a ? actLink(a) : 'None'}</dd></dl>`}
    <dl class="kv one"><dt>Reporter</dt><dd>${esc(uname(t.reporter))} (${esc(orgName((userOf(t.reporter) || {}).org).split(' ')[0])})</dd><dt>Created</dt><dd>${D.stamp(t.created)}</dd><dt>Updated</dt><dd>${D.stamp(t.updated)}</dd>${a && ed ? `<dt>Activity</dt><dd>${actLink(a)}</dd>` : ''}</dl>
    <h3>History</h3><ol class="timeline">${t.history.slice().reverse().slice(0, 12).map(h => `<li><span class="muted">${D.stamp(h[0])}</span><br>${esc(uname(h[1]))} ${h[2] === 'created' ? 'created the ticket' : 'changed ' + esc(hName(h[2]).toLowerCase()) + (h[2] === 'description' ? '' : ' to <strong>' + esc(hVal(h[2], h[4])) + '</strong>')}</li>`).join('')}</ol>
   </aside></div></section>`;
}

/* ---------- Ticket actions ---------- */

function touchTicket(t, field, oldV, newV) {
  t.history.push([D.now(), Sess.userId, field, oldV ?? '', newV ?? '']);
  t.updated = D.now();
  audit('ticket.' + (field === 'created' ? 'create' : 'update'), 'ticket', t.key, field === 'created' ? null : { [field]: oldV }, field === 'created' ? { title: t.title } : { [field]: newV });
}
function ticketNotify(t, msg, extra) {
  notify([t.assignee, t.reporter].concat(extra || []).filter(id => id !== Sess.userId), 'Ticket', t.key + ': ' + msg, { ws: t.ws, visibleToDevs: false, link: '#/tickets?ws=' + t.ws + '&id=' + t.id });
}

ACT.ticketOpen = el => { const t = St().tickets.find(x => x.id === el.dataset.id); if (t) go('tickets', Object.assign({}, parseHash().query, { ws: t.ws, id: t.id })); };
document.addEventListener('keydown', e => { const c = e.target.closest && e.target.closest('.tcard'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ACT.ticketOpen(c); } });

ACT.ticketNew = el => {
  const u = me(), ws = el.dataset.ws;
  if (!canRaiseTicket(u, ws)) return toast('You cannot raise tickets on this board.', 'err');
  const acts = visActs(u).filter(x => x.ws === ws);
  modal('Create ticket: ' + wsName(ws), `<form data-form="ticketNew" class="fgrid"><input type="hidden" name="ws" value="${ws}">
   ${fld('Type', sel('type', ticketTypes(), u.org === 'BOCRA' ? 'UAT defect' : 'Task'))}${fld('Priority', sel('priority', ticketPriorities(), 'Medium'))}
   ${fld('Summary', inp('title', '', 'text', 'required maxlength="200"'), 'span2')}
   ${fld('Description', ta('description', '', 'rows="5"'), 'span2')}
   ${fld('Assignee', sel('assignee', assignees(ws).map(x => [x.id, x.fullName]), (devLeads(ws)[0] || '')))}${fld('Due date', inp('due', '', 'date'))}
   ${fld('Linked activity', sel('activityId', [['', 'None']].concat(acts.map(x => [x.id, num(x) + '. ' + x.name]))))}${fld('Labels (comma separated)', inp('labels', ''))}
   <div class="span2"><button class="btn">Create</button></div></form>`, true);
};
FORM.ticketNew = fd => {
  const u = me(), S = St(), ws = fd.get('ws');
  if (!canRaiseTicket(u, ws)) return toast('Not allowed.', 'err');
  const n = S.tickets.filter(t => t.ws === ws).length + 1;
  const assignee = fd.get('assignee');
  if (!assignees(ws).some(x => x.id === assignee)) return toast('Choose an assignee who works on this board.', 'err');
  const t = { id: uid('t'), key: ticketPrefix(ws) + '-' + n, ws, type: fd.get('type'), title: String(fd.get('title')).trim(), description: String(fd.get('description') || '').trim(),
    priority: fd.get('priority'), status: 'To do', assignee, reporter: u.id, activityId: fd.get('activityId') || null,
    labels: String(fd.get('labels') || '').split(',').map(s => s.trim()).filter(Boolean), due: fd.get('due') || null, estimate: null,
    created: D.now(), updated: D.now(), comments: [], history: [] };
  if (!t.title) return toast('Give the ticket a summary.', 'err');
  S.tickets.push(t);
  touchTicket(t, 'created', '', 'To do');
  ticketNotify(t, 'assigned to you: ' + t.title);
  closeModal();
  go('tickets', { ws, id: t.id });
  commit(t.key + ' created.');
};
FORM.ticketFields = fd => {
  const u = me(), t = St().tickets.find(x => x.id === fd.get('id'));
  if (!canEditTicket(u, t)) return toast('You cannot change this ticket.', 'err');
  const changes = [];
  ['status', 'assignee', 'priority', 'type', 'due', 'activityId'].forEach(k => {
    const v = fd.get(k) || null;
    if (String(t[k] ?? '') !== String(v ?? '')) changes.push([k, t[k], v]);
  });
  const as = changes.find(c => c[0] === 'assignee');
  if (as && !assignees(t.ws).some(x => x.id === as[2])) return toast('Choose an assignee who works on this board.', 'err');
  if (!changes.length) return toast('No changes.');
  changes.forEach(([k, o, v]) => { t[k] = v; touchTicket(t, k, o, v); });
  ticketNotify(t, changes.map(([k, , v]) => (k === 'assignee' ? 'assigned to ' + uname(v) : k + ' ' + (v || 'cleared'))).join(', '));
  commit(t.key + ' updated.');
};
FORM.ticketEdit = fd => {
  const u = me(), t = St().tickets.find(x => x.id === fd.get('id'));
  if (!canEditTicket(u, t)) return toast('You cannot change this ticket.', 'err');
  const v = { title: String(fd.get('title')).trim(), description: String(fd.get('description') || '').trim(), labels: String(fd.get('labels') || '').split(',').map(s => s.trim()).filter(Boolean), estimate: fd.get('estimate') === '' ? null : Math.max(0, +fd.get('estimate')) };
  if (!v.title) return toast('Give the ticket a summary.', 'err');
  Object.keys(v).forEach(k => { if (JSON.stringify(t[k]) !== JSON.stringify(v[k])) { const o = t[k]; t[k] = v[k]; touchTicket(t, k, Array.isArray(o) ? o.join(', ') : o, Array.isArray(v[k]) ? v[k].join(', ') : v[k]); } });
  commit('Saved.');
};
FORM.ticketComment = fd => {
  const u = me(), t = St().tickets.find(x => x.id === fd.get('id')), body = String(fd.get('body') || '').trim();
  if (!canSeeTicket(u, t) || !body) return;
  t.comments.push({ by: u.id, at: D.now(), body });
  t.updated = D.now();
  audit('ticket.comment', 'ticket', t.key, null, { body: body.slice(0, 200) });
  ticketNotify(t, uname(u.id) + ' commented');
  commit('Comment added.');
};

// Drag a card to another column to change status
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.tcard'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.ticket); c.classList.add('dragging'); } });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.tcard'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.bcol.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.bcol'); if (col) { e.preventDefault(); document.querySelectorAll('.bcol.over').forEach(x => x !== col && x.classList.remove('over')); col.classList.add('over'); } });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.bcol');
  if (!col) return;
  e.preventDefault();
  const t = St().tickets.find(x => x.id === e.dataTransfer.getData('text/plain'));
  if (!t || t.status === col.dataset.status) return;
  if (!canEditTicket(me(), t)) return toast('You cannot move tickets on this board.', 'err');
  const o = t.status;
  t.status = col.dataset.status;
  touchTicket(t, 'status', o, t.status);
  ticketNotify(t, 'moved to ' + t.status);
  commit(t.key + ' moved to ' + t.status + '.');
});

// Ticket data for the report builder
DATASETS.tickets = {
  label: 'Developer tickets', date: 'created', status: 'status',
  cols: [['key', 'Key'], ['title', 'Summary'], ['ws', 'Workstream'], ['type', 'Type'], ['priority', 'Priority'], ['status', 'Status'], ['assignee', 'Assignee'], ['reporter', 'Reporter'], ['created', 'Created'], ['due', 'Due'], ['estimate', 'Estimate']],
  def: ['key', 'title', 'ws', 'type', 'priority', 'status', 'assignee'],
  rows: u => St().tickets.filter(t => canSeeTicket(u, t)).map(t => ({ key: t.key, title: t.title, ws: wsName(t.ws), type: t.type, priority: t.priority, status: t.status, assignee: uname(t.assignee), reporter: uname(t.reporter), created: D.dateOf(t.created), due: t.due || '', estimate: t.estimate ?? '' }))
};

render();

</script>
