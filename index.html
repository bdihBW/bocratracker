<style>
/* BDIH Project Tracker. Palette taken from the Botswana Innovation Hub mark:
   maroon wordmark, olive "o", and the gold to terracotta tile arc. */
:root {
  --paper: #ffffff; --surface: #ffffff; --sunk: #f5f3f0;
  --ink: #231b18; --ink-2: #5d514b; --ink-3: #8b7f77; --rule: #e3d9cd; --rule-2: #cfc2b3;
  --maroon: #6e1f23; --maroon-2: #8f2a22; --terra: #b8452a; --salmon: #e7a48c; --gold: #e9a93a; --sand: #f3e2c4; --olive: #7d7a3a;
  --ok: #4c6a2c; --ok-bg: #edf0df; --info: #2f5578; --info-bg: #e6ecf1; --warn: #94620e; --warn-bg: #f9edd6;
  --bad: #a3301f; --bad-bg: #f7e2dc; --plum: #5d3a6b; --plum-bg: #efe6f0; --mute-bg: #eee8e0;
  --wsA: #0f7f86; --wsB: #3d2a78; --wsS: #6e1f23;
  --serif: 'Google Sans Flex', 'Google Sans', 'Roboto', 'Segoe UI', sans-serif;
  --sans: 'Google Sans Flex', 'Google Sans', 'Roboto', 'Segoe UI', sans-serif;
  --r: 4px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 15px/1.55 var(--sans); color: var(--ink); background: var(--paper); font-feature-settings: 'tnum' 1; -webkit-font-smoothing: antialiased; }
a { color: var(--maroon-2); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { color: var(--terra); }
h1 { font: 700 28px/1.2 var(--serif); letter-spacing: -.015em; margin: 0 0 6px; color: var(--ink); }
h2 { font: 600 18px/1.25 var(--serif); margin: 0 0 12px; }
h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 18px 0 8px; font-weight: 700; }
code { background: var(--sunk); padding: 1px 5px; border-radius: 3px; font-size: .9em; }
.muted { color: var(--ink-3); } .small { font-size: 14px; } .bad { color: var(--bad); font-weight: 600; } .warnc { color: var(--warn); font-weight: 600; }
.sr { position: absolute; left: -9999px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
::selection { background: var(--sand); }

/* ---------- Layout ---------- */
.layout { display: flex; min-height: 100vh; }
.side { width: 238px; flex: none; background: var(--surface); border-right: 1px solid var(--rule); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: block; padding: 20px 22px 4px; }
.brand-logo { width: 150px; height: auto; display: block; }
.brand-sub { margin: 0 22px 18px; padding-top: 10px; border-top: 1px solid var(--rule); font: 600 15px var(--serif); color: var(--maroon); }
.brand-sub span { display: block; font: 400 14px var(--sans); color: var(--ink-3); }
.side nav { display: flex; flex-direction: column; padding: 0 10px; }
.side nav a { color: var(--ink-2); text-decoration: none; padding: 7px 12px; border-left: 3px solid transparent; display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
.side nav a:hover { color: var(--ink); background: var(--sunk); }
.side nav a.on { color: var(--maroon); border-left-color: var(--maroon); background: #f8f1ef; font-weight: 600; }
.pill { background: var(--terra); color: #fff; border-radius: 9px; padding: 0 6px; font-size: 14px; font-weight: 700; }
.side-foot { margin-top: auto; padding: 16px 22px 20px; font-size: 14px; color: var(--ink-3); }
.side-foot p { margin: 8px 0 0; }
.partners { display: flex; align-items: center; gap: 14px; padding-top: 14px; border-top: 1px solid var(--rule); }
.p-logo { height: 34px; width: auto; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 16px; padding: 12px 28px; background: var(--surface); border-bottom: 1px solid var(--rule); flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
.top::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: linear-gradient(90deg, #a7a88f, #f5d38a 18%, #e3892d 34%, #8f2a22 50%, #e7a48c 70%, #b8452a 88%, #6e1f23); }
.period { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.period-l { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 700; margin-right: 4px; }
.period input { width: 148px; padding: 5px 8px; }
.period .to { color: var(--ink-3); }
.period .sd { font-size: 14px; color: var(--ink-3); margin-left: 8px; }
.period .sd strong { color: var(--ink); font-weight: 600; }
.who { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.who .me { display: flex; align-items: center; gap: 9px; text-decoration: none; color: var(--ink); }
.who .me small { display: block; color: var(--ink-3); font-size: 14px; line-height: 1.2; }
.who .me strong { font-weight: 600; font-size: 14px; }
.av { width: 34px; height: 34px; border-radius: 50%; background: var(--maroon); color: #fff; display: flex; align-items: center; justify-content: center; font: 600 14px var(--sans); letter-spacing: .03em; }
.bell { position: relative; display: flex; color: var(--ink-2); }
.bell svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }
.bell b { position: absolute; top: -5px; right: -8px; background: var(--terra); color: #fff; font-size: 14px; border-radius: 8px; padding: 0 5px; line-height: 15px; }
.menu { display: none; flex-direction: column; gap: 4px; padding: 6px; }
.menu span { width: 20px; height: 2px; background: var(--ink); display: block; }
#view { padding: 26px 28px 40px; max-width: 1480px; width: 100%; }
#view:focus { outline: none; }
.ro-banner { background: var(--warn-bg); color: #5a3d07; padding: 9px 28px; border-bottom: 1px solid #ecd6a9; }
.ro-banner.err { background: var(--bad-bg); color: var(--bad); }
.page-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.page-h p { margin: 2px 0; }
.page-h > h1:only-child, .page-h h1 { margin-bottom: 2px; }
.actions, .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.crumb { margin: 0 0 6px; font-size: 14px; display: flex; gap: 6px; align-items: center; }

/* ---------- Surfaces ---------- */
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px; margin-bottom: 18px; }
.card.flush { padding: 0; overflow: hidden; }
.card.flush .empty { padding: 18px 20px; }
.grid { display: grid; gap: 18px; margin-bottom: 18px; }
.grid > .card { margin-bottom: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g2r { display: grid; gap: 18px; grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr); margin-bottom: 18px; }
.g2r > .card { margin-bottom: 0; }
.ph { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.ph h2, .ph h3 { margin: 0; }
.ph small { color: var(--ink-3); font: 400 14px var(--sans); display: block; }

/* KPI strip: a ruled ledger rather than a row of boxes */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 22px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); }
.kpi { padding: 14px 18px; display: flex; flex-direction: column; gap: 3px; border-right: 1px solid var(--rule); }
.kpi:last-child { border-right: 0; }
.kpi.wide { min-width: 200px; }
.kpi .l { font-size: 14px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 700; }
.kpi .v { font: 600 30px/1.1 var(--serif); color: var(--ink); }
.kpi .v.sm { font: 600 17px/1.3 var(--serif); }
.kpi .v small { font: 400 14px var(--sans); color: var(--ink-3); margin-left: 3px; }
.kpi .s { font-size: 14px; color: var(--ink-3); }
.kpi.alert-k .v { color: var(--bad); }
.kpi.alert-k { background: #fff; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin-bottom: 18px; }
.ledger div { padding: 12px 16px 12px 0; }
.ledger span { display: block; font-size: 14px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 700; }
.ledger strong { font: 600 22px var(--serif); }
.kv { display: grid; grid-template-columns: minmax(140px, 36%) 1fr; gap: 7px 14px; margin: 0; }
.kv dt { color: var(--ink-3); font-size: 14px; }
.kv dd { margin: 0; }
.dev-panel { border-top: 3px solid var(--wsS); }
.dev-panel.ws-A { border-top-color: var(--wsA); } .dev-panel.ws-B { border-top-color: var(--wsB); }
.dp-id { display: flex; align-items: center; gap: 12px; }
.dp-logo { height: 40px; width: auto; flex: none; }

/* ---------- Status language: a mark plus words, never colour alone ---------- */
.hb, .st, .tag, .ws, .timer { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; line-height: 1.3; }
.hb { font-weight: 600; }
.hb::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.h-complete, .p-on-track { color: var(--ok); }
.h-on-track { color: var(--info); }
.h-behind, .p-at-risk { color: var(--warn); }
.h-late, .p-off-track { color: var(--bad); }
.h-not-due { color: var(--ink-3); }
.h-cancelled { color: var(--ink-3); text-decoration: line-through; }
.h-ongoing { color: var(--plum); }
.h-not-due::before { background: transparent; border: 1.5px solid currentColor; }
.st { padding: 1px 7px; border-radius: 3px; background: var(--mute-bg); color: var(--ink-2); font-weight: 500; font-size: 14px; }
.s-complete, .s-approved, .s-reviewed, .s-done, .s-active, .s-yes, .s-made, .s-resolved, .s-ready, .s-paid, .s-approved-for-payment { background: var(--ok-bg); color: var(--ok); }
.s-in-progress, .s-filed, .s-submitted, .s-under-bdih-review, .s-under-bocra-review, .s-monitoring, .s-recommended, .s-under-assessment, .s-under-review { background: var(--info-bg); color: var(--info); }
.s-returned, .s-returned-to-developer, .s-not-ready, .s-late, .s-rejected, .s-inactive, .s-no { background: var(--bad-bg); color: var(--bad); }
.s-on-hold, .s-due, .s-pending, .s-required, .s-open, .s-queried { background: var(--warn-bg); color: var(--warn); }
.tag { padding: 0 6px; border: 1px solid var(--rule-2); border-radius: 3px; color: var(--ink-2); font-size: 14px; }
.tag.crit { border-color: #e2b2a7; color: var(--bad); }
.ws { font-size: 14px; color: var(--ink-2); }
.ws::before { content: ""; width: 3px; height: 13px; background: currentColor; border-radius: 1px; }
.ws-A::before { background: var(--wsA); } .ws-B::before { background: var(--wsB); } .ws-S::before { background: var(--wsS); }
.timer { font-weight: 600; font-size: 14px; }
.timer::before { content: ""; width: 10px; height: 10px; border: 1.5px solid currentColor; border-radius: 50%; box-sizing: border-box; background: linear-gradient(currentColor, currentColor) 50% 20% / 1.5px 4px no-repeat; }
.timer.ok { color: var(--ok); } .timer.warn { color: var(--warn); } .timer.over { color: var(--bad); }
.score { font: 600 15px var(--serif); padding: 0 7px; border-radius: 3px; }
.score.shi { background: var(--bad-bg); color: var(--bad); } .score.smd { background: var(--warn-bg); color: var(--warn); } .score.slo { background: var(--ok-bg); color: var(--ok); }

/* Progress bar: fill for actual, tick for planned */
.bar { position: relative; height: 6px; background: var(--sunk); border-radius: 3px; min-width: 70px; margin: 6px 0 4px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--maroon); border-radius: 3px; }
.bar b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--gold); }

/* ---------- Controls ---------- */
.btn { background: var(--maroon); color: #fff; border: 1px solid var(--maroon); border-radius: var(--r); padding: 7px 15px; font: 600 14px var(--sans); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: background .15s; }
.btn:hover { background: var(--maroon-2); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--rule-2); }
.btn.ghost:hover { background: var(--sunk); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 14px; }
.btn.block { width: 100%; justify-content: center; margin-top: 10px; padding: 10px; }
.btn.icon { padding: 4px 9px; }
.icon { background: none; border: 0; font-size: 18px; cursor: pointer; color: inherit; }
.link { background: none; border: 0; padding: 0; color: var(--maroon-2); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font: inherit; }
input, select, textarea { font: 15px var(--sans); padding: 7px 10px; border: 1px solid var(--rule-2); border-radius: var(--r); background: #fff; color: var(--ink); width: 100%; }
input:focus, select:focus, textarea:focus { border-color: var(--maroon); outline: none; box-shadow: 0 0 0 3px rgba(110, 31, 35, .12); }
input[type=checkbox] { width: auto; accent-color: var(--maroon); }
input:disabled, select:disabled, textarea:disabled { background: var(--sunk); color: var(--ink-3); }
.f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.f > span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.f.inline { margin: 0; min-width: 150px; }
.chk { display: flex; gap: 8px; align-items: center; margin: 5px 0; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.span2 { grid-column: 1 / -1; }
fieldset { border: 1px solid var(--rule); border-radius: var(--r); margin: 0 0 12px; padding: 8px 14px; }
legend { font-weight: 600; font-size: 14px; color: var(--ink-2); padding: 0 4px; }
fieldset .cols { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
.inline-form { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--rule); }
.inline-form .f { margin: 0; flex: 1; min-width: 130px; }
.filters { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .grow { flex: 1; }
.alert { background: var(--bad-bg); color: var(--bad); padding: 9px 12px; border-radius: var(--r); border-left: 3px solid var(--bad); }
blockquote { margin: 8px 0; padding: 6px 14px; border-left: 3px solid var(--gold); background: #fbf5ea; font-style: italic; }

.tabs { display: flex; gap: 22px; border-bottom: 1px solid var(--rule); margin-bottom: 16px; flex-wrap: wrap; }
.tabs a { padding: 8px 0; text-decoration: none; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tabs a:hover { color: var(--ink); }
.tabs a.on { color: var(--maroon); border-color: var(--maroon); font-weight: 600; }
.toolbar .tabs { margin: 0 8px 0 0; border: 0; gap: 0; background: var(--sunk); border-radius: var(--r); padding: 3px; }
.toolbar .tabs a { padding: 4px 12px; border: 0; margin: 0; border-radius: 3px; }
.toolbar .tabs a.on { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }

/* ---------- Tables ---------- */
.tw { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; color: var(--ink-3); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; padding: 10px 12px 8px; border-bottom: 1px solid var(--ink); white-space: nowrap; background: var(--surface); }
.tbl td { padding: 9px 12px; border-bottom: 1px solid #eee6dc; vertical-align: top; }
.tbl tbody tr:hover td { background: #faf8f6; }
.tbl .num, .tbl td.num { text-align: right; white-space: nowrap; }
.tbl tr.crit td:nth-child(3) { box-shadow: inset 2px 0 0 var(--bad); }
.tbl tr.ms td { background: #fbf9f6; }
.tbl.compact td, .tbl.compact th { padding: 5px 6px; }
.empty { color: var(--ink-3); margin: 6px 0; }
.alist { list-style: none; padding: 0; margin: 0; }
.alist li { padding: 7px 0; border-bottom: 1px solid #f0e9e0; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; }
.check { margin: 6px 0; padding-left: 18px; font-size: 14px; }
.check .n { color: var(--bad); } .check .y { color: var(--ok); }
.subv { border-left: 2px solid var(--rule-2); padding: 4px 0 4px 16px; margin-bottom: 18px; }
.rev { border-top: 1px dashed var(--rule); padding-top: 8px; margin-top: 8px; }
.comment { border-bottom: 1px solid #f0e9e0; padding: 8px 0; }
.comment p { margin: 3px 0; }
.mention { color: var(--maroon-2); font-weight: 600; }
.folders { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.folder { padding: 8px 14px 8px 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 10px; }
.folder em { font-style: normal; color: var(--ink-3); font-size: 14px; }
.folder.on { border-color: var(--maroon); box-shadow: inset 0 -2px 0 var(--maroon); }
.f-logo { height: 26px; width: auto; }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { display: flex; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid #eee6dc; flex-wrap: wrap; }
.notes li.unread { box-shadow: inset 3px 0 0 var(--terra); background: #fdf8f1; }
.notes li.unread a { font-weight: 600; }
.timeline { list-style: none; margin: 0; padding: 0 0 0 16px; border-left: 2px solid var(--rule); }
.timeline li { position: relative; padding: 0 0 14px 6px; }
.timeline li::before { content: ""; position: absolute; left: -22px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--maroon); }
.timeline p { margin: 2px 0 0; font-size: 14px; }
.closure-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 12px; font-size: 14px; }
.closure-list small { color: var(--ink-3); }
.temp code { font-size: 20px; padding: 6px 10px; }
.rltable td.rl { text-align: center; min-width: 48px; }
.rltable td.some { background: var(--info-bg); }
.rltable td.over { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.rltable th[scope=row] { background: var(--surface); position: sticky; left: 0; text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 500; border-bottom: 1px solid #eee6dc; }

/* Heat map */
.heat { display: grid; grid-template-columns: 24px repeat(5, 1fr); gap: 3px; max-width: 320px; position: relative; padding-left: 16px; }
.hm-c { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 2px; font: 600 16px var(--serif); }
.hm-c.lo { background: #e8ebd6; } .hm-c.md { background: #f6dca6; } .hm-c.hi { background: #eeb3a3; }
.hm-y, .hm-x { display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--ink-3); }
.hm-ylab { position: absolute; left: -20px; top: 45%; transform: rotate(-90deg); font-size: 14px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }
.hm-xlab { grid-column: 2 / -1; text-align: center; font-size: 14px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; }

/* ---------- Charts and Gantt ---------- */
.chart { width: 100%; max-width: 560px; }
.ct, .ct-h { font: 14px var(--sans); fill: var(--ink); }
.ct-h { font-weight: 700; fill: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; font-size: 14px; }
.c-pl { fill: #dcd2c4; background: #dcd2c4; }
.c-ac.ws-A { fill: var(--wsA); background: var(--wsA); } .c-ac.ws-B { fill: var(--wsB); background: var(--wsB); }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; color: var(--ink-3); }
.sw { display: inline-block; width: 14px; height: 9px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.gantt-wrap { overflow: auto; max-height: 75vh; }
.gantt-wrap svg { display: block; font: 14px var(--sans); }
.g-left { fill: var(--surface); }
.g-stripe { fill: #fafaf9; }
.g-closed, .sw.g-closed { fill: #f2d9cf; background: #f2d9cf; }
.g-we { fill: #f2ede6; }
.g-wk { stroke: #e6ddd2; }
.g-t { fill: var(--ink-3); } .g-t.b { font-weight: 700; fill: var(--ink-2); } .g-t.sd { fill: var(--bad); font-weight: 700; }
.g-d { fill: #b1a59a; font-size: 14px; }
.g-l { fill: var(--ink); }
.g-bar, .sw.g-bar { fill: #ead9bf; background: #ead9bf; }
.g-bar.t-review { fill: #d6dde3; }
.g-bar.t-meeting { fill: #e2d6e4; }
.g-bar.crit { stroke: var(--bad); stroke-width: 1.4; }
.sw.crit-sw { border: 2px solid var(--bad); }
.g-done, .sw.g-done { fill: var(--maroon); background: var(--maroon); }
.g-behind, .sw.g-behind { fill: url(#hatch); background: repeating-linear-gradient(45deg, var(--bad) 0 2px, #fff 2px 5px); }
.g-hatch { fill: var(--bad); }
.g-bl, .sw.g-bl { fill: var(--ink); background: var(--ink); }
.g-ms { fill: var(--gold); stroke: var(--ink); stroke-width: .8; }
.g-ms.h-complete { fill: var(--ok); } .g-ms.h-late { fill: var(--bad); }
.g-link { fill: none; stroke: #9b8f84; stroke-width: 1; }
.g-arr { fill: #9b8f84; }
.g-sd { stroke: var(--bad); stroke-width: 1.5; stroke-dasharray: 4 3; }

/* ---------- Report paper ---------- */
.rpt.paper { background: #fff; border: 1px solid var(--rule); box-shadow: 0 1px 0 var(--rule), 0 12px 30px -18px rgba(60, 30, 10, .35); padding: 36px 44px; margin-bottom: 18px; font-family: 'Times New Roman', Times, serif; font-size: 15px; color: #000; overflow-x: auto; }
.rpt h1 { font: bold 24px 'Times New Roman', serif; } .rpt h2 { font: bold 17px 'Times New Roman', serif; margin: 20px 0 6px; } .rpt h3 { font: bold 15px 'Times New Roman', serif; text-transform: none; letter-spacing: 0; color: #000; }
.rpt table { border-collapse: collapse; width: 100%; margin: 4px 0 12px; }
.rpt th { background: #7b4a24; color: #fff; border: 1px solid #000; padding: 4px 6px; text-align: left; }
.rpt td { border: 1px solid #000; padding: 4px 6px; vertical-align: top; }
.rpt-head { display: flex; gap: 20px; align-items: center; border-bottom: 2px solid #6e1f23; padding-bottom: 12px; }
.rpt-brand { width: 170px; flex: none; }
.rpt-logo { width: 170px; height: auto; display: block; }

/* ---------- Modal and toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(35, 20, 15, .42); display: flex; align-items: flex-start; justify-content: center; padding: 6vh 16px; z-index: 50; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 6px; width: 100%; max-width: 580px; box-shadow: 0 24px 60px rgba(30, 15, 10, .3); border-top: 3px solid var(--maroon); }
.modal.wide { max-width: 880px; }
.modal header { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px 12px; border-bottom: 1px solid var(--rule); }
.modal header h2 { margin: 0; }
.modal-body { padding: 18px 22px 20px; }
.pv { width: 100%; height: 70vh; border: 0; object-fit: contain; }
#toasts { position: fixed; bottom: 18px; right: 18px; display: flex; flex-direction: column; gap: 8px; z-index: 60; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: #fff; padding: 11px 16px; border-radius: var(--r); box-shadow: 0 10px 24px rgba(0, 0, 0, .2); border-left: 3px solid var(--gold); }
.toast.err { border-left-color: #ff8a73; }

/* ---------- Sign in ---------- */
.login-wrap { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(360px, 480px); background: var(--surface); }
.login-art { position: relative; overflow: hidden; background: #fff; border-right: 1px solid var(--rule); padding: 56px 60px; display: flex; flex-direction: column; justify-content: space-between; }
.login-arc { position: absolute; right: -170px; top: -250px; width: 640px; height: 640px; }
.login-copy { position: relative; max-width: 540px; margin: auto 0 40px; }
.login-copy h1 { font: 600 38px/1.12 var(--serif); color: var(--maroon); margin: 8px 0 14px; letter-spacing: -.015em; }
.login-copy p { font-size: 17px; color: var(--ink-2); margin: 0; }
.eyebrow { font-size: 14px !important; text-transform: uppercase; letter-spacing: .14em; font-weight: 700; color: var(--olive) !important; }
.login-partners { position: relative; display: flex; align-items: center; gap: 22px; padding-top: 18px; border-top: 1px solid rgba(110, 31, 35, .2); }
.login-partners span { font-size: 14px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); font-weight: 700; }
.login-partners .p-logo { height: 44px; }
.login-card { padding: 48px 44px; display: flex; flex-direction: column; justify-content: center; }
.login-logo { width: 190px; height: auto; margin-bottom: 26px; }
.login-h { font: 600 22px var(--serif); margin: 0 0 18px; }
.demo { margin-top: 22px; border-top: 1px solid var(--rule); padding-top: 12px; }
.demo summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }

/* ---------- Responsive ---------- */
@media (max-width: 1080px) {
  .g2, .g2r { grid-template-columns: 1fr; }
  .kpi.wide { grid-column: auto; }
  .kpi { border-bottom: 1px solid var(--rule); }
}
@media (max-width: 900px) {
  .login-wrap { grid-template-columns: 1fr; }
  .login-art { padding: 32px 24px; min-height: 0; }
  .login-copy { margin-top: 150px; }
  .login-copy h1 { font-size: 28px; }
  .login-arc { width: 360px; height: 360px; right: -120px; top: -150px; }
  .login-card { padding: 32px 24px; }
}
@media (max-width: 760px) {
  .side { position: fixed; left: -250px; z-index: 40; transition: left .2s; }
  body.nav-open .side { left: 0; box-shadow: 0 0 40px rgba(0, 0, 0, .3); }
  .menu { display: flex; }
  .top { padding: 10px 16px; gap: 10px; }
  .who .me span:last-child, .period-l, .period .sd { display: none; }
  .period input { width: 132px; }
  #view { padding: 18px 16px 32px; }
  .fgrid { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; }
  .kv dt { margin-top: 8px; }
  h1 { font-size: 24px; }
}
@media print {
  .side, .top, .toolbar, .filters, .btn, .ro-banner, .tabs { display: none !important; }
  body { background: #fff; }
  .card { break-inside: avoid; }
}

/* ---------- Main dashboard ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; padding: 6px 0 24px; border-bottom: 1px solid var(--rule); margin-bottom: 22px; }
.hero .eyebrow { font-size: 14px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; color: var(--olive); margin: 0 0 6px; }
.hero h1 { font-size: 34px; margin-bottom: 10px; }
.lede { font-size: 17px; line-height: 1.6; color: var(--ink-2); max-width: 760px; margin: 0 0 16px; }
.lede strong { font-weight: 700; }
.lede .p-on-track { color: var(--ok); } .lede .p-at-risk { color: var(--warn); } .lede .p-off-track { color: var(--bad); }
.hero-r { text-align: center; }
.ring { width: 150px; height: 150px; display: block; margin: 0 auto; }
.ring.big { width: 190px; height: 190px; }
.rg-track { fill: none; stroke: var(--sunk); stroke-width: 12; }
.rg-plan-track { fill: none; stroke: #f1ece6; stroke-width: 4; }
.rg-plan { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; }
.rg-act { fill: none; stroke: var(--maroon); stroke-width: 12; stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring.ws-A .rg-act { stroke: var(--wsA); } .ring.ws-B .rg-act { stroke: var(--wsB); }
.rg-v { font: 700 26px var(--sans); fill: var(--ink); }
.rg-l { font: 400 14px var(--sans); fill: var(--ink-3); }
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border: 1px solid var(--rule); border-radius: var(--r); margin-bottom: 22px; }
.stats a { padding: 16px 18px; border-right: 1px solid var(--rule); text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 2px; transition: background .15s; }
.stats a:last-child { border-right: 0; }
.stats a:hover { background: var(--sunk); }
.stats span { font-size: 14px; color: var(--ink-3); }
.stats strong { font-size: 28px; font-weight: 700; line-height: 1.2; }
.stats strong small { font-size: 16px; color: var(--ink-3); font-weight: 500; }
.stats em { font-style: normal; font-size: 14px; color: var(--ink-2); }
.tl-wrap { overflow-x: auto; }
.timeline-svg { width: 100%; min-width: 900px; height: auto; display: block; font-family: var(--sans); }
.tl-grid { stroke: #ece8e3; }
.tl-ax { font-size: 14px; fill: var(--ink-3); }
.tl-row { font-size: 15px; font-weight: 600; fill: var(--ink); }
.tl-seg { font-size: 14px; font-weight: 600; fill: #fff; }
.tl-p1, .sw.tl-p1 { fill: #8a8a50; background: #8a8a50; }
.tl-p2, .sw.tl-p2 { fill: #d08a2c; background: #d08a2c; }
.tl-p3, .sw.tl-p3 { fill: #a3381f; background: #a3381f; }
.tl-closed { fill: #f3e6e1; }
.tl-ms { fill: #fff; stroke: var(--ink); stroke-width: 1.5; }
.tl-ms.done { fill: var(--ok); stroke: var(--ok); } .tl-ms.late { fill: var(--bad); stroke: var(--bad); }
.tl-bl { stroke: var(--ink); stroke-width: 2; }
.tl-lab { font-size: 14px; font-weight: 600; fill: var(--ink-2); }
.tl-lab.today { fill: var(--terra); } .tl-lab.ce { fill: var(--maroon); }
.tl-today { stroke: var(--terra); stroke-width: 2; }
.tl-ce { stroke: var(--maroon); stroke-width: 2; stroke-dasharray: 5 4; }
.sw.diamond { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--ink); background: #fff; border-radius: 1px; }
.sw.tick { width: 3px; height: 14px; background: var(--ink); }
.dcols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; margin-bottom: 22px; }
.dcol { border: 1px solid var(--rule); border-radius: var(--r); padding: 20px 22px; border-top: 4px solid var(--wsS); }
.dcol.ws-A { border-top-color: var(--wsA); } .dcol.ws-B { border-top-color: var(--wsB); }
.dcol-h { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.dcol-h > div { flex: 1; }
.dcol-h h2 { margin: 0; font-size: 20px; }
.dcol-h p { margin: 0; color: var(--ink-3); font-size: 14px; }
.dcol-logo { height: 52px; width: auto; flex: none; }
.dcol-top { display: grid; grid-template-columns: 150px 1fr; gap: 20px; align-items: center; margin-bottom: 8px; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
.mini dt { font-size: 14px; color: var(--ink-3); }
.mini dd { margin: 0; font-size: 22px; font-weight: 700; }
.mini dd small { font-size: 14px; font-weight: 500; color: var(--ink-3); }
.mini dd small.bad { color: var(--bad); }
.mini dd a { text-decoration: none; color: inherit; }
.mini dd a.bad { color: var(--bad); } .mini dd a.warnc { color: var(--warn); }
.dcol-chart { margin: 8px 0 6px; }
.scurve { width: 100%; height: auto; display: block; font-family: var(--sans); }
.sc-grid { stroke: #eeeae5; }
.sc-ax { font-size: 14px; fill: var(--ink-3); }
.sc-closed { fill: #f6ebe7; }
.sc-ce { stroke: var(--maroon); stroke-dasharray: 5 4; }
.sc-today { stroke: var(--terra); stroke-width: 1.5; }
.sc-bl { fill: none; stroke: #9a948d; stroke-width: 2; stroke-dasharray: 6 5; }
.sc-fc { fill: none; stroke-width: 2; opacity: .45; }
.sc-ac { fill: none; stroke-width: 3.5; stroke-linejoin: round; }
.sc-fc.ws-A, .sc-ac.ws-A { stroke: var(--wsA); } .sc-fc.ws-B, .sc-ac.ws-B { stroke: var(--wsB); }
.sc-dot.ws-A { fill: var(--wsA); } .sc-dot.ws-B { fill: var(--wsB); }
.legend .ln { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--ink-2); vertical-align: middle; margin-right: 4px; }
.legend .ln.dash { border-top: 2px dashed #9a948d; }
.legend .ln.fc { opacity: .45; border-top-width: 2px; }
.legend .ln.ws-A { border-color: var(--wsA); } .legend .ln.ws-B { border-color: var(--wsB); }
.dcol-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid #f0ece7; }
.dcol-row > span { color: var(--ink-3); min-width: 170px; }
.dcol-row strong { font-weight: 600; margin-left: auto; text-align: right; }
.seg { display: flex; gap: 3px; flex: 1; }
.seg i { height: 10px; flex: 1; background: var(--sunk); border-radius: 2px; }
.seg i.on { background: var(--ok); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.when { display: inline-block; min-width: 58px; font-weight: 600; color: var(--ink-2); }

/* ---------- Document bank ---------- */
.chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
.chips .grow { flex: 1; min-width: 220px; margin-left: auto; max-width: 360px; }
.chip { padding: 6px 14px; border: 1px solid var(--rule-2); border-radius: 20px; text-decoration: none; color: var(--ink-2); }
.chip em { font-style: normal; color: var(--ink-3); margin-left: 4px; }
.chip.on { background: var(--maroon); border-color: var(--maroon); color: #fff; }
.chip.on em { color: #f1d9d6; }
.bank { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; margin-bottom: 22px; }
.bank-item { display: grid; grid-template-columns: 56px 1fr; gap: 6px 16px; border: 1px solid var(--rule); border-radius: var(--r); padding: 16px; }
.bank-item .btns { grid-column: 2; }
.bank-body h3 { text-transform: none; letter-spacing: 0; font-size: 17px; color: var(--ink); margin: 0 0 4px; }
.bank-body h3 a { color: inherit; text-decoration: none; }
.bank-body h3 a:hover { color: var(--maroon); text-decoration: underline; }
.bank-body p { margin: 0; font-size: 14px; }
.ext { width: 56px; height: 64px; border-radius: 4px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; font-weight: 700; font-size: 14px; color: #fff; background: #777; position: relative; }
.ext::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 14px 14px 0; border-color: transparent #fff transparent transparent; }
.ext-docx, .ext-doc { background: #2b5797; } .ext-xlsx, .ext-csv { background: #1e7145; } .ext-pdf { background: #b3261e; } .ext-pptx { background: #c4511f; } .ext-zip { background: #6b5d4f; }

/* ---------- User management ---------- */
.notice { border: 1px solid #ecd6a9; background: var(--warn-bg); color: #5a3d07; padding: 10px 14px; border-radius: var(--r); margin-bottom: 16px; }
.baskets { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.basket { display: grid; grid-template-columns: 56px 1fr; grid-template-rows: auto auto auto; column-gap: 12px; padding: 16px; border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; color: var(--ink); align-items: center; }
.basket > :first-child { grid-row: 1 / span 3; }
.basket.on { border-color: var(--maroon); box-shadow: inset 0 -3px 0 var(--maroon); }
.basket:hover { background: var(--sunk); }
.bk-logo { width: 56px; height: 48px; }
.bk-mono { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; }
.bk-mono.ws-A { background: var(--wsA); } .bk-mono.ws-B { background: var(--wsB); }
.bk-name { font-weight: 700; font-size: 17px; }
.bk-sub, .bk-n { font-size: 14px; color: var(--ink-3); }
.bk-n strong { color: var(--ink); }
.ph.pad { padding: 16px 20px 0; }

/* ---------- Plan grid, permissions, report builder ---------- */
.plan-grid td.pc { padding: 4px 6px; }
.plan-grid input.pe, .plan-grid select.pe { border-color: transparent; background: transparent; padding: 5px 6px; min-width: 90px; }
.plan-grid input.pe:hover, .plan-grid select.pe:hover { border-color: var(--rule-2); }
.plan-grid input.pe:focus, .plan-grid select.pe:focus { background: #fff; border-color: var(--maroon); }
.plan-grid td:nth-child(2) input.pe { min-width: 280px; }
.plan-grid input.pe.n { width: 80px; min-width: 70px; }
.nowrap { white-space: nowrap; }
.perm-grid th.rot { vertical-align: bottom; height: 170px; padding: 0 0 8px; text-transform: none; letter-spacing: 0; }
.perm-grid th.rot span { writing-mode: vertical-rl; transform: rotate(180deg); font-size: 14px; color: var(--ink-2); font-weight: 600; white-space: nowrap; }
.perm-grid th[scope=row] { text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink); font-weight: 500; border-bottom: 1px solid #eee8e1; min-width: 300px; }
.perm-grid td.pc-c { text-align: center; }
.perm-grid input { width: 18px; height: 18px; }
.builder fieldset .cols { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }

@media (max-width: 1180px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stats a:nth-child(3) { border-right: 0; }
  .stats a:nth-child(-n+3) { border-bottom: 1px solid var(--rule); }
  .dcols, .g3 { grid-template-columns: 1fr; }
  .baskets { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 760px) {
  .hero { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats a { border-bottom: 1px solid var(--rule); }
  .dcol-top { grid-template-columns: 1fr; }
  .bank { grid-template-columns: 1fr; }
  .baskets { grid-template-columns: 1fr; }
  .dcol-row { flex-wrap: wrap; }
}

/* ---------- Developer tickets ---------- */
.board-tabs { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.board-tabs a { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border: 1px solid var(--rule); border-radius: var(--r); text-decoration: none; color: var(--ink); min-width: 240px; }
.board-tabs a span { display: flex; flex-direction: column; font-weight: 600; }
.board-tabs a small { font-size: 14px; font-weight: 400; color: var(--ink-3); }
.board-tabs a.on { border-color: var(--maroon); box-shadow: inset 0 -3px 0 var(--maroon); }
.bt-logo { height: 36px; width: auto; }
.tstats { display: flex; gap: 26px; flex-wrap: wrap; padding: 10px 0 14px; border-bottom: 1px solid var(--rule); margin-bottom: 14px; color: var(--ink-3); }
.tstats strong { font-size: 22px; color: var(--ink); margin-right: 4px; }
.tstats strong.bad { color: var(--bad); }
.filters .tabs { margin: 0 8px 0 0; border: 0; gap: 0; background: var(--sunk); border-radius: var(--r); padding: 3px; align-self: flex-end; }
.filters .tabs a { padding: 5px 14px; border: 0; margin: 0; border-radius: 3px; }
.filters .tabs a.on { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.filters .grow { flex: 1; min-width: 220px; }
.board { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
.bcol { background: var(--sunk); border-radius: 6px; display: flex; flex-direction: column; min-height: 320px; transition: background .15s, box-shadow .15s; }
.bcol.over { background: #efe6e2; box-shadow: inset 0 0 0 2px var(--maroon); }
.bcol header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px 8px; }
.bcol header h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); margin: 0; }
.bcol header span { font-size: 14px; color: var(--ink-3); background: #fff; border-radius: 10px; padding: 0 8px; }
.bcol-blocked header h2 { color: var(--bad); }
.bcol-done header h2 { color: var(--ok); }
.bcol-body { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.bcol-empty { color: var(--ink-3); text-align: center; padding: 18px 0; margin: 0; border: 1px dashed var(--rule-2); border-radius: 4px; }
.tcard { background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 10px 12px; cursor: pointer; box-shadow: 0 1px 1px rgba(0, 0, 0, .04); transition: box-shadow .15s, transform .1s; }
.tcard:hover { box-shadow: 0 3px 10px rgba(40, 20, 10, .12); }
.tcard[draggable=true] { cursor: grab; }
.tcard.dragging { opacity: .5; transform: rotate(1.5deg); }
.tc-title { margin: 0 0 8px; font-weight: 500; line-height: 1.4; }
.tc-labels { display: flex; gap: 4px; flex-wrap: wrap; margin: 0 0 8px; }
.tc-labels span { font-size: 14px; background: #eef2f6; color: var(--info); border-radius: 3px; padding: 0 6px; }
.tcard footer { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tc-key { font-size: 14px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.tc-est { font-size: 14px; background: var(--sunk); border-radius: 9px; padding: 0 7px; color: var(--ink-2); }
.tc-c { font-size: 14px; color: var(--ink-3); }
.tc-act { margin: 8px 0 0; padding-top: 6px; border-top: 1px dashed var(--rule); font-size: 14px; color: var(--ink-3); }
.av.sm { width: 26px; height: 26px; font-size: 14px; margin-left: auto; }
.ttype { font-size: 14px; font-weight: 600; padding: 0 6px; border-radius: 3px; }
.tt-story { background: #e7f2e3; color: #3f6b2f; } .tt-task { background: #e6eef6; color: #2f5578; } .tt-bug, .tt-uat-defect { background: var(--bad-bg); color: var(--bad); } .tt-support-request { background: #efe6f0; color: var(--plum); }
.prio { display: inline-block; width: 12px; height: 12px; vertical-align: middle; }
.prio-highest { background: linear-gradient(var(--bad), var(--bad)) 0 0 / 100% 3px no-repeat, linear-gradient(var(--bad), var(--bad)) 0 5px / 100% 3px no-repeat, linear-gradient(var(--bad), var(--bad)) 0 10px / 100% 2px no-repeat; }
.prio-high { border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid var(--terra); width: 0; height: 0; }
.prio-medium { background: linear-gradient(var(--warn), var(--warn)) 0 3px / 100% 2px no-repeat, linear-gradient(var(--warn), var(--warn)) 0 7px / 100% 2px no-repeat; }
.prio-low { border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid var(--info); width: 0; height: 0; }
.tdetail { border-top: 3px solid var(--maroon); }
.tgrid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; }
.tside { border-left: 1px solid var(--rule); padding-left: 22px; }
.kv.one { grid-template-columns: 110px 1fr; margin-bottom: 14px; }
.dcol-row .tk { margin-left: auto; font-weight: 600; }
@media (max-width: 900px) { .tgrid { grid-template-columns: 1fr; } .tside { border-left: 0; padding-left: 0; } }

/* ---------- Collapsible plan phases, download quota, leads ---------- */
.phase-row td { background: #f7f4f1; border-top: 1px solid var(--rule-2); padding: 8px 12px; }
.phase-h { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.phase-tog { background: none; border: 0; font: 700 15px var(--sans); color: var(--maroon); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 2px 0; }
.phase-tog .chev { width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); transition: transform .15s; margin: 0 4px 4px 2px; }
.phase-tog[aria-expanded=false] .chev { transform: rotate(-45deg); margin-bottom: 0; }
.ph-meta { color: var(--ink-3); font-size: 14px; }
.ph-bar { width: 160px; margin-left: auto; }
.dl-quota { margin: -6px 0 14px; color: var(--ink-3); }
.dl-quota.bad strong { color: var(--bad); }
.leads { margin: 0 0 12px; color: var(--ink-2); }
.alist li > span:first-child + strong { margin-left: auto; }
.login-art { display: flex; align-items: center; justify-content: center; }
.login-arc { position: static; width: min(78%, 560px); height: auto; }

/* ---------- Cloudflare Turnstile ---------- */
.cf-ts { margin: 6px 0 4px; min-height: 66px; }
#ts-note:empty { display: none; }

/* ---------- Tablet and phone ---------- */
@media (max-width: 1024px) {
  .top { gap: 10px 14px; }
  .period { order: 3; width: 100%; }
  .who { order: 2; }
  .board { grid-template-columns: repeat(5, minmax(250px, 1fr)); scroll-snap-type: x mandatory; }
  .bcol { scroll-snap-align: start; }
  .tgrid { grid-template-columns: 1fr; }
  .tside { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 14px; }
  .hero h1 { font-size: 30px; }
}
@media (max-width: 760px) {
  .top { padding: 8px 14px; }
  .menu { order: 1; }
  .who { order: 2; margin-left: auto; gap: 10px; }
  .who .btn { padding: 4px 9px; }
  .period { order: 3; gap: 6px; flex-wrap: nowrap; }
  .period input { width: auto; flex: 1; min-width: 0; padding: 5px 6px; }
  .period .btn { flex: none; }
  #view { padding: 16px 14px 32px; }
  .page-h { padding-bottom: 10px; margin-bottom: 14px; }
  .page-h .actions { width: 100%; }
  .hero { gap: 12px; padding-bottom: 16px; }
  .hero h1 { font-size: 26px; }
  .lede { font-size: 16px; }
  .ring.big { width: 150px; height: 150px; }
  .stats strong { font-size: 22px; }
  .dcol { padding: 16px 14px; }
  .dcol-row > span { min-width: 0; }
  .dcol-row strong { margin-left: 0; text-align: left; }
  .mini dd { font-size: 19px; }
  .board { grid-template-columns: repeat(5, 82vw); }
  .board-tabs a { min-width: 0; flex: 1; }
  .tstats { gap: 14px; }
  .filters .f.inline { min-width: calc(50% - 8px); flex: 1; }
  .filters .grow { min-width: 100%; }
  .toolbar .btn, .toolbar .tabs { flex: 1 1 auto; }
  .ph-bar { width: 100%; margin-left: 0; }
  .modal-bg { padding: 0; align-items: stretch; }
  .modal, .modal.wide { max-width: none; border-radius: 0; min-height: 100vh; }
  .login-art { display: none; }
  .login-card { padding: 28px 20px; min-height: 100vh; }
  .rpt.paper { padding: 18px 14px; }
  .rpt-head { flex-direction: column; align-items: flex-start; }
  .bank-item { grid-template-columns: 44px 1fr; padding: 12px; }
  .ext { width: 44px; height: 52px; }
  .chips .grow { max-width: none; }
  .tbl td, .tbl th { padding: 8px 10px; }
}
@media (max-width: 1024px) {
  .side { position: fixed; left: -260px; z-index: 40; transition: left .2s; box-shadow: none; }
  body.nav-open .side { left: 0; box-shadow: 0 0 40px rgba(0, 0, 0, .3); }
  body.nav-open::after { content: ""; position: fixed; inset: 0; background: rgba(30, 20, 15, .3); z-index: 39; }
  .menu { display: flex; order: 1; }
  .who { margin-left: auto; }
}

/* ===================================================================================
   Final palette: one accent (BIH maroon) on white with dark, readable text. Colour is
   kept for meaning only: green done, amber behind, red late. Everything else is neutral.
   =================================================================================== */
:root {
  --ink: #16110f; --ink-2: #352d29; --ink-3: #574d48; --rule: #ddd5cd; --rule-2: #bfb3a8; --sunk: #f4f1ee;
  --info: #352d29; --info-bg: #ece7e3; --plum: #352d29; --plum-bg: #ece7e3;
  --wsA: #6e1f23; --wsB: #2f2a28; --wsS: #8a7f78;
  --ok: #2f6b2f; --warn: #8a5a00; --bad: #a3221a;
}
body { color: var(--ink); }
.top::before { background: var(--maroon); height: 2px; }
.muted, .small.muted { color: var(--ink-3); }
.kpi .l, .stats span, .ledger span, .tbl th, h3 { color: var(--ink-2); }
.side nav a { color: var(--ink-2); }
.side nav a.on { background: #f6eeec; }

/* Status labels: neutral unless they carry a warning or a result */
.st { background: var(--sunk); color: var(--ink-2); border: 1px solid var(--rule); }
.s-in-progress, .s-filed, .s-submitted, .s-under-bdih-review, .s-under-bocra-review, .s-monitoring, .s-recommended, .s-under-assessment, .s-under-review {
  background: #fff; color: var(--ink); border-color: var(--ink-3); }
.h-on-track { color: var(--ink-2); }
.h-ongoing { color: var(--ink-2); }

/* Charts and plan in one hue */
.c-pl { fill: #d9d1ca; background: #d9d1ca; }
.rg-plan { stroke: var(--ink-3); }
.bar b { background: var(--ink); }
.tl-p1, .sw.tl-p1 { fill: #cbbab2; background: #cbbab2; }
.tl-p2, .sw.tl-p2 { fill: #9a645b; background: #9a645b; }
.tl-p3, .sw.tl-p3 { fill: #6e1f23; background: #6e1f23; }
.tl-p1 + .tl-seg, .tl-seg { fill: #fff; }
.tl-today { stroke: var(--ink); } .tl-lab.today { fill: var(--ink); }
.g-bar, .sw.g-bar { fill: #e5ddd6; background: #e5ddd6; }
.g-bar.t-review, .g-bar.t-meeting { fill: #ece7e3; }
.g-ms { fill: var(--maroon); stroke: #fff; }
.sc-today { stroke: var(--ink-3); }
.ttype { background: var(--sunk) !important; color: var(--ink-2) !important; }
.tt-bug, .tt-uat-defect { background: var(--bad-bg) !important; color: var(--bad) !important; }
.tc-labels span { background: var(--sunk); color: var(--ink-2); }
.ext { background: var(--ink-2) !important; }
.ext-pdf { background: var(--maroon) !important; }
.chip.on { background: var(--ink); border-color: var(--ink); }
.bk-mono.ws-A { background: var(--maroon); } .bk-mono.ws-B { background: var(--ink-2); }

/* A little character: headed sections with a short accent rule */
.card > h2:first-child::after, .ph h2::after { content: ""; display: block; width: 28px; height: 2px; background: var(--maroon); margin-top: 6px; }
.dcol-h h2::after, .modal h2::after, .tdetail h2::after { display: none; }
.hero h1 { letter-spacing: -.02em; }

/* While the live system is saving or loading */
body.busy { cursor: progress; }
body.busy::before { content: ""; position: fixed; left: 0; top: 0; height: 3px; width: 100%; z-index: 100;
  background: linear-gradient(90deg, transparent, var(--maroon), transparent); background-size: 40% 100%; background-repeat: no-repeat; animation: busy 1s linear infinite; }
@keyframes busy { from { background-position: -40% 0; } to { background-position: 140% 0; } }

/* ===================================================================================
   Plain finish: no accent bars or shadows on boxes, grouped menu, photo on sign-in.
   =================================================================================== */
.side nav a, .side nav a.on { border-left: 0; border-radius: 4px; }
.side nav a.on { background: var(--sunk); color: var(--ink); font-weight: 700; }
.nav-g { margin: 14px 12px 4px; font-size: 14px; font-weight: 700; color: var(--ink-3); letter-spacing: .02em; }
.nav-g:first-child { margin-top: 0; }
.dcol, .dcol.ws-A, .dcol.ws-B { border-top: 1px solid var(--rule); }
.card > h2:first-child::after, .ph h2::after { display: none; }
.alert { border-left: 0; border: 1px solid #e8c4bf; }
.toast { border-left: 0; }
.modal { border-top: 0; }
blockquote { border-left: 0; background: var(--sunk); font-style: normal; border-radius: 4px; }
.notes li.unread { box-shadow: none; background: var(--sunk); }
.folder.on, .basket.on, .board-tabs a.on { box-shadow: none; border-color: var(--ink); }
.toolbar .tabs a.on, .filters .tabs a.on { box-shadow: none; border: 1px solid var(--rule); }
.tcard, .tcard:hover { box-shadow: none; }
.tcard:hover { border-color: var(--rule-2); }
.tbl tr.crit td:nth-child(3) { box-shadow: none; }

/* Developers compared */
.cmp-t th[scope="row"] { font-weight: 600; color: var(--ink-2); width: 200px; }
.cmp-t thead th { font-size: 16px; color: var(--ink); }
.cmp-t td { min-width: 220px; }
.cmp-bar { position: relative; height: 8px; background: var(--sunk); border-radius: 4px; margin: 4px 0 6px; max-width: 320px; }
.cmp-bar b { position: absolute; left: 0; top: 0; bottom: 0; background: var(--maroon); border-radius: 4px; }
.cmp-bar i { position: absolute; top: -3px; width: 2px; height: 14px; background: var(--ink); }
.page-h.sub h2 { margin: 0; font-size: 20px; }

/* Sign-in: the BIH building */
.login-art.photo { background-color: #2b2a26; background-size: cover; background-position: center; border-right: 0; padding: 0; }
@media (max-width: 860px) { .login-art.photo { display: block; min-height: 180px; } }

/* Change password: a small centred card */
.pw-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--sunk); }
.pw-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--rule); border-radius: 6px; padding: 28px; }
.pw-card h1 { font-size: 22px; margin: 14px 0 10px; }
.pw-logo { width: 140px; height: auto; }
.pw-card .btn.block { margin-top: 8px; }
.cmp-t th[scope="row"] { text-transform: none; letter-spacing: 0; font-size: 15px; }

</style>

<script>
/* js/core.js */
'use strict';
/* BDIH Project Tracking Tool: core model, business-day calendar, scheduling engine, health rules
   and access rules. Prototype build: data lives in this browser (localStorage). In production the
   same rules are enforced by Supabase Row Level Security, Storage policies and Edge Functions
   (SRS sections 3 and 5); the user interface only reflects them. */

const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const D = {
  parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); },
  fmt(t) { return t.toISOString().slice(0, 10); },
  add(s, n) { const t = D.parse(s); t.setUTCDate(t.getUTCDate() + n); return D.fmt(t); },
  addMonths(s, n) { const t = D.parse(s); t.setUTCMonth(t.getUTCMonth() + n); return D.fmt(t); },
  dow(s) { return D.parse(s).getUTCDay(); },
  diff(a, b) { return Math.round((D.parse(b) - D.parse(a)) / 864e5); },
  nice(s) { if (!s) return ''; const t = D.parse(s); return t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()] + ' ' + t.getUTCFullYear(); },
  short(s) { if (!s) return ''; const t = D.parse(s); return t.getUTCDate() + ' ' + MONTHS[t.getUTCMonth()]; },
  month(s) { const t = D.parse(s); return ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][t.getUTCMonth()] + ' ' + t.getUTCFullYear(); },
  // Dates display in Botswana local time (UTC+2); timestamps are stored in UTC.
  today() { return new Date(Date.now() + 2 * 3600e3).toISOString().slice(0, 10); },
  now() { return new Date().toISOString(); },
  dateOf(iso) { return new Date(new Date(iso).getTime() + 2 * 3600e3).toISOString().slice(0, 10); },
  stamp(iso) {
    if (!iso) return '';
    const t = new Date(new Date(iso).getTime() + 2 * 3600e3).toISOString();
    return D.nice(t.slice(0, 10)) + ', ' + t.slice(11, 16);
  }
};

const ROLES = {
  ADMIN: 'System Administrator', BDIH_DIRECTOR: 'BDIH Director', BDIH_LEAD: 'BDIH Project Leader',
  BDIH_PO: 'BDIH Project Officer', BDIH_BA: 'BDIH Business Analyst', BDIH_TEAM: 'BDIH Developer',
  BOCRA_REP: 'BOCRA Project Lead', BOCRA_TEAM: 'BOCRA Team Member',
  DEV_LEAD: 'Developer Lead', DEV_MEMBER: 'Developer Team Member'
};
const ROLE_ORGS = {
  ADMIN: ['BDIH'], BDIH_DIRECTOR: ['BDIH'], BDIH_LEAD: ['BDIH'], BDIH_PO: ['BDIH'], BDIH_BA: ['BDIH'], BDIH_TEAM: ['BDIH'],
  BOCRA_REP: ['BOCRA'], BOCRA_TEAM: ['BOCRA'], DEV_LEAD: ['DEVA', 'DEVB'], DEV_MEMBER: ['DEVA', 'DEVB']
};
const BDIH_STAFF = ['ADMIN', 'BDIH_LEAD', 'BDIH_PO', 'BDIH_BA', 'BDIH_TEAM'];
// Role-based access: each permission lists the roles that hold it by default. Administrators can
// change the grid (Administration, Roles and permissions); scope rules (own workstream) still apply.
const PERMISSIONS = [
  ['plan.edit', 'Edit the project plan: activities, links, durations, dates', ['ADMIN', 'BDIH_LEAD', 'BDIH_PO', 'BDIH_BA']],
  ['plan.baseline', 'Save baselines and lock reporting periods', ['ADMIN', 'BDIH_LEAD']],
  ['progress.any', 'Update progress on any activity', BDIH_STAFF],
  ['progress.own', 'Update progress in own workstream', ['DEV_LEAD', 'DEV_MEMBER']],
  ['progress.bocra', 'Update activities that BOCRA leads', ['BOCRA_REP', 'BOCRA_TEAM']],
  ['submit.deliverable', 'Submit deliverables for review', ['ADMIN', 'BDIH_LEAD', 'DEV_LEAD']],
  ['review.bdih', 'Record the BDIH review recommendation', BDIH_STAFF],
  ['review.bocra', 'Approve or return submissions for BOCRA', ['ADMIN', 'BOCRA_REP']],
  ['weekly.file', 'File the weekly developer report', ['DEV_LEAD']],
  ['weekly.review', 'Review weekly developer reports', BDIH_STAFF],
  ['report.publish', 'Publish the official monthly report', ['ADMIN', 'BDIH_LEAD']],
  ['invoice.submit', 'Raise invoices', ['ADMIN', 'BDIH_LEAD', 'DEV_LEAD']],
  ['invoice.status', 'Update invoice status', ['ADMIN', 'BOCRA_REP']],
  ['bank.upload', 'Add documents to the document bank', BDIH_STAFF.concat(['BOCRA_REP', 'BOCRA_TEAM'])],
  ['register.edit', 'Edit risks, issues and decisions', BDIH_STAFF.concat(['BOCRA_REP'])],
  ['register.delete', 'Delete register entries', ['ADMIN', 'BDIH_LEAD']],
  ['cr.recommend', 'Assess and recommend change requests', ['ADMIN', 'BDIH_LEAD']],
  ['cr.decide', 'Decide change requests for BOCRA', ['ADMIN', 'BOCRA_REP']],
  ['meeting.edit', 'Record meetings and minutes', BDIH_STAFF],
  ['settings.edit', 'Edit settings and the closure calendar', ['ADMIN', 'BDIH_LEAD']],
  ['ticket.create', 'Raise tickets for the developers', BDIH_STAFF.concat(['BOCRA_REP', 'BOCRA_TEAM', 'DEV_LEAD', 'DEV_MEMBER'])],
  ['ticket.manage', 'Move, assign and edit tickets', BDIH_STAFF.concat(['DEV_LEAD', 'DEV_MEMBER'])],
  ['users.manage', 'Manage users, roles and passwords', ['ADMIN']],
  ['audit.view', 'View the audit log', ['ADMIN', 'BDIH_LEAD', 'BDIH_DIRECTOR']]
];
// Permissions a Developer Lead can delegate to a team member
const DELEGABLE = ['submit.deliverable', 'weekly.file', 'invoice.submit'];
function permRoles(key) {
  const o = Store.state && Store.state.rolePerms && Store.state.rolePerms[key];
  return o || (PERMISSIONS.find(p => p[0] === key) || [, , []])[2];
}
function hasPerm(u, key) {
  if (!u || !u.active) return false;
  const rs = rolesOf(u), allowed = permRoles(key);
  if (key === 'users.manage' && rs.includes('ADMIN')) return true;   // never lock out the administrator
  if (rs.some(r => allowed.includes(r))) return true;
  return rs.includes('DEV_MEMBER') && !!u.delegated && DELEGABLE.includes(key) && allowed.includes('DEV_LEAD');
}
// A user can hold several roles: a primary role plus extra roles, all within their organisation
const rolesOf = u => (u ? [u.role].concat((u.extraRoles || []).filter(r => r !== u.role)) : []);
const hasRole = (u, ...roles) => rolesOf(u).some(r => roles.includes(r));
const roleLabel = u => rolesOf(u).map(r => roleName(r)).join(', ');
// The Director view is read-only unless the person also holds a working role
const isViewer = u => !!u && rolesOf(u).every(r => r === 'BDIH_DIRECTOR');
const STATUSES = ['Not started', 'In progress', 'Submitted', 'Under BDIH review', 'Returned to developer',
  'Under BOCRA review', 'Approved', 'Complete', 'On hold', 'Cancelled'];
const TYPES = ['Task', 'Review', 'Milestone', 'Meeting', 'Report'];
const DEFAULT_PHASES = ['Phase 1', 'Phase 2', 'Phase 3'];
const DEFAULT_PHASE_NAMES = {
  'Phase 1': 'Phase 1: Planning and requirements',
  'Phase 2': 'Phase 2: Design and build',
  'Phase 3': 'Phase 3: Testing, commissioning and closure'
};
const HEALTH = ['Complete', 'Cancelled', 'Ongoing', 'Late', 'Behind', 'Not due', 'On track'];
const FILE_TYPES = ['pdf', 'docx', 'xlsx', 'pptx', 'png', 'jpg', 'jpeg', 'svg', 'zip', 'mp4', 'csv', 'txt', 'md'];
const MAX_FILE = 100 * 1024 * 1024;
const COMMON_PASSWORDS = ['password1234', 'password12345', '123456789012', 'qwerty123456', 'botswana2026',
  'letmein12345', 'welcome12345', 'admin1234567', 'iloveyou1234', 'changeme1234', 'gaborone2026', 'abc123456789'];

/* ---------- Business-day calendar ---------- */

class Calendar {
  constructor(settings, holidays) {
    const closed = new Map();
    if (settings.festiveStart && settings.festiveEnd && settings.festiveStart <= settings.festiveEnd) {
      for (let d = settings.festiveStart; d <= settings.festiveEnd; d = D.add(d, 1)) closed.set(d, 'Festive closure');
    }
    (holidays || []).forEach(h => { if (!closed.has(h.date)) closed.set(h.date, h.reason); });
    this.closed = closed;
    this.from = D.add(settings.projectStart, -400);
    this.to = D.add(settings.projectStart, 1500);
    this.days = [];
    this.idx = new Map();
    for (let d = this.from; d <= this.to; d = D.add(d, 1)) {
      const w = D.dow(d);
      if (w !== 0 && w !== 6 && !closed.has(d)) { this.idx.set(d, this.days.length); this.days.push(d); }
    }
  }
  isClosed(d) { const w = D.dow(d); return w === 0 || w === 6 || this.closed.has(d); }
  // Index of the first business day on or after d
  ceil(d) {
    if (d < this.from) return 0;
    if (d > this.to) return this.days.length - 1;
    for (let g = 0; g < 60 && !this.idx.has(d); g++) d = D.add(d, 1);
    return this.idx.has(d) ? this.idx.get(d) : this.days.length - 1;
  }
  // Index of the last business day on or before d
  floor(d) {
    if (d < this.from) return 0;
    if (d > this.to) return this.days.length - 1;
    for (let g = 0; g < 60 && !this.idx.has(d); g++) d = D.add(d, -1);
    return this.idx.has(d) ? this.idx.get(d) : 0;
  }
  date(i) { return this.days[Math.max(0, Math.min(this.days.length - 1, i))]; }
  addBD(d, n) { return this.date(this.ceil(d) + n); }
}

/* ---------- Scheduling engine (Appendix B.1) ---------- */

function actDuration(a, S) {
  if (a.type === 'Milestone') return 0;
  if (a.type === 'Review' && a.reviewStage === 'BDIH') return +S.settings.bdihReviewDays || 3;
  if (a.type === 'Review' && a.reviewStage === 'BOCRA') return +S.settings.bocraReviewDays || 5;
  return Math.max(1, +a.duration || 1);
}

function isDone(a) { return a.status === 'Complete' || a.status === 'Approved'; }

function runSchedule(S) {
  const cal = new Calendar(S.settings, S.holidays);
  S._cal = cal;
  const acts = S.activities.filter(a => !a.deleted);
  const by = new Map(acts.map(a => [a.id, a]));
  const preds = new Map(), succs = new Map();
  acts.forEach(a => { preds.set(a.id, []); succs.set(a.id, []); });
  S.links.forEach(l => {
    if (by.has(l.from) && by.has(l.to)) { preds.get(l.to).push(l); succs.get(l.from).push(l); }
  });
  S._by = by; S._preds = preds; S._succs = succs;

  // Topological order (Kahn)
  const indeg = new Map(acts.map(a => [a.id, preds.get(a.id).length]));
  const queue = acts.filter(a => !indeg.get(a.id)).map(a => a.id);
  const order = [];
  while (queue.length) {
    const id = queue.shift();
    order.push(id);
    succs.get(id).forEach(l => { indeg.set(l.to, indeg.get(l.to) - 1); if (!indeg.get(l.to)) queue.push(l.to); });
  }
  const errors = [];
  if (order.length < acts.length) {
    const stuck = acts.filter(a => !order.includes(a.id));
    errors.push('Circular dependency involving: ' + stuck.map(a => a.name).join(', '));
    stuck.forEach(a => order.push(a.id));
  }

  const ps = cal.ceil(S.settings.projectStart);
  order.forEach(id => {
    const a = by.get(id), pl = preds.get(id), ms = a.type === 'Milestone';
    a._dur = actDuration(a, S);
    // Milestones complete themselves when every predecessor is complete
    if (ms && pl.length) {
      const all = pl.every(l => isDone(by.get(l.from)));
      if (all && !isDone(a)) {
        a.status = 'Complete'; a.pct = 100; a.autoDone = true;
        a.actualFinish = cal.date(Math.max(...pl.map(l => by.get(l.from)._fi)));
      } else if (!all && a.autoDone) {
        a.status = 'Not started'; a.pct = 0; a.actualFinish = null; a.autoDone = false;
      }
    }
    let es;
    if (a.actualStart && !ms) es = cal.ceil(a.actualStart);
    else if (a.fixedStart) es = cal.ceil(a.fixedStart);
    else if (pl.length) {
      es = -1e9;
      pl.forEach(l => {
        const pf = by.get(l.from)._fi ?? ps, lag = +l.lag || 0;
        es = Math.max(es, ms ? pf + lag : pf + 1 + lag);
      });
    } else es = ps;
    let ef = ms ? es : es + a._dur - 1;
    if (a.actualFinish) { ef = cal.floor(a.actualFinish); if (ms || ef < es) es = ms ? ef : Math.min(es, ef); }
    a._si = es; a._fi = ef; a.start = cal.date(es); a.finish = cal.date(ef);
  });

  // Backward pass for critical path, per workstream
  const wsEnd = {};
  acts.forEach(a => { wsEnd[a.ws] = Math.max(wsEnd[a.ws] ?? -1e9, a._fi); });
  [...order].reverse().forEach(id => {
    const a = by.get(id);
    const same = succs.get(id).filter(l => by.get(l.to).ws === a.ws);
    let lf;
    if (!same.length) lf = wsEnd[a.ws];
    else {
      lf = 1e9;
      same.forEach(l => {
        const s = by.get(l.to), lag = +l.lag || 0;
        lf = Math.min(lf, s.type === 'Milestone' ? s._ls - lag : s._ls - 1 - lag);
      });
    }
    a._ls = a.type === 'Milestone' ? lf : lf - a._dur + 1;
    a._float = a._ls - a._si;
    a._crit = a._float <= 0 && a.type !== 'Meeting' && !isDone(a) && a.status !== 'Cancelled';
  });
  return errors;
}

// Would linking from -> to create a cycle? Returns the path names if so.
function findCycle(S, from, to) {
  const seen = new Set(), stack = [[to, [to]]];
  while (stack.length) {
    const [id, path] = stack.pop();
    if (id === from) return path;
    if (seen.has(id)) continue;
    seen.add(id);
    (S._succs.get(id) || []).forEach(l => stack.push([l.to, path.concat(l.to)]));
  }
  return null;
}

/* ---------- Progress and health (Appendix B.2) ---------- */

function plannedPct(a, sdi) {
  if (a.type === 'Milestone') return sdi >= a._fi ? 100 : 0;
  if (sdi < a._si) return 0;
  return Math.min(100, Math.round((sdi - a._si + 1) / Math.max(1, a._dur) * 100));
}

function health(a, sdi) {
  const pct = +a.pct || 0;
  if (isDone(a)) return 'Complete';
  if (a.status === 'Cancelled') return 'Cancelled';
  if (a.type === 'Meeting' && a._dur > 1 && a._si <= sdi && sdi <= a._fi) return 'Ongoing';
  if (a._fi < sdi && pct < 100) return 'Late';
  if (pct < 100 && plannedPct(a, sdi) - pct > 10) return 'Behind';
  if (a._si > sdi) return 'Not due';
  return 'On track';
}

function weighted(acts, sdi) {
  let w = 0, act = 0, pl = 0;
  acts.forEach(a => {
    if (a.deleted || a.type === 'Meeting' || a.type === 'Milestone' || a.status === 'Cancelled') return;
    const d = Math.max(1, a._dur);
    w += d; act += d * (+a.pct || 0); pl += d * plannedPct(a, sdi);
  });
  return { actual: w ? act / w : 0, planned: w ? pl / w : 0 };
}

function perfStatus(actual, planned, s) {
  if (planned <= 0) return { spi: null, status: 'On track' };
  const spi = actual / planned;
  return { spi, status: spi >= s.thrOnTrack ? 'On track' : spi >= s.thrAtRisk ? 'At risk' : 'Off track' };
}

function currentBaseline(S) { return S.baselines.find(b => b.id === S.settings.currentBaselineId) || null; }

function slipOf(S, a) {
  const bl = currentBaseline(S);
  const it = bl && bl.items[a.id];
  if (!it) return null;
  return a._fi - S._cal.ceil(it.finish);
}

function contractEnd(S) {
  const c = S._cal;
  return c.date(c.floor(D.add(D.addMonths(S.settings.projectStart, +S.settings.contractMonths || 3), -1)));
}

/* ---------- Access rules (SRS section 3) ---------- */

function isOversight(u) { return !!u && (u.org === 'BDIH' || u.org === 'BOCRA'); }

// Workstreams a developer is mapped to (user_workstreams); null means oversight (all)
function wsOf(u) {
  if (!u) return [];
  if (isOversight(u)) return null;
  const base = u.org === 'DEVA' ? ['A'] : u.org === 'DEVB' ? ['B'] : [];
  return base.concat(u.extraWs || []);
}

function canSee(u, ws, visibleToDevs) {
  if (!u || !u.active) return false;
  if (isOversight(u)) return true;
  if ((wsOf(u) || []).includes(ws)) return true;
  return ws === 'S' && !!visibleToDevs;
}
function canSeeItem(u, it) { return !!it && canSee(u, it.ws, it.visibleToDevs); }

const can = {
  editPlan: u => hasPerm(u, 'plan.edit'),
  editSettings: u => hasPerm(u, 'settings.edit'),
  admin: u => hasPerm(u, 'users.manage'),
  audit: u => hasPerm(u, 'audit.view'),
  baseline: u => hasPerm(u, 'plan.baseline'),
  progress(u, a) {
    if (!canSeeItem(u, a)) return false;
    if (hasPerm(u, 'progress.any')) return true;
    if (hasPerm(u, 'progress.bocra')) { const r = Store.state.resources.find(x => x.id === a.lead); if (r && r.org === 'BOCRA') return true; }
    return hasPerm(u, 'progress.own') && (wsOf(u) || []).includes(a.ws);
  },
  submit(u, a) {
    if (!a || !a.submittable || !canSeeItem(u, a) || !hasPerm(u, 'submit.deliverable')) return false;
    if (u.org === 'BDIH') return true;
    return a.ws !== 'S' && (wsOf(u) || []).includes(a.ws);
  },
  bdihReview: u => hasPerm(u, 'review.bdih'),
  bocraDecide: u => hasPerm(u, 'review.bocra'),
  weekly: u => hasPerm(u, 'weekly.file'),
  weeklyReview: u => hasPerm(u, 'weekly.review'),
  publish: u => hasPerm(u, 'report.publish'),
  upload: u => !isViewer(u),
  docDelete: (u, d) => hasPerm(u, 'progress.any') || d.versions.some(v => v.by === u.id),
  regCreate: u => !isViewer(u),
  regEdit: u => hasPerm(u, 'register.edit'),
  regDelete: u => hasPerm(u, 'register.delete'),
  crRecommend: u => hasPerm(u, 'cr.recommend'),
  crDecide: u => hasPerm(u, 'cr.decide'),
  meetingEdit: u => hasPerm(u, 'meeting.edit'),
  resources: u => isOversight(u),
  // Invoices: developers and BDIH raise them; they go to the BOCRA Project Lead, who sets the status
  invoiceSubmit: u => hasPerm(u, 'invoice.submit'),
  invoiceStatus: u => hasPerm(u, 'invoice.status'),
  seeInvoice: (u, inv) => isOversight(u) || inv.org === u.org,
  bankUpload: u => hasPerm(u, 'bank.upload')
};
const INVOICE_STATUSES = ['Submitted', 'Under review', 'Queried', 'Approved for payment', 'Paid', 'Rejected'];

/* ---------- Values the administrator can change (Administration, Settings and Lists) ---------- */
const cfg = () => (Store.state && Store.state.settings) || {};
const lists = () => (Store.state && Store.state.lookups) || {};
// Phases: keys stay stable on activities; the administrator edits the display names and adds phases
function phaseKeys() { return (lists().phases || DEFAULT_PHASES.map(k => ({ key: k, name: DEFAULT_PHASE_NAMES[k] }))).map(p => p.key); }
function phaseName(k) { const p = (lists().phases || []).find(x => x.key === k); return p ? p.name : DEFAULT_PHASE_NAMES[k] || k; }
// Role names can be relabelled; the role keys and their permissions stay the same
function roleName(r) { return ((Store.state && Store.state.roleNames) || {})[r] || ROLES[r] || r; }
function roleEntries() { return Object.keys(ROLES).map(r => [r, roleName(r)]); }
const vatRate = () => (cfg().vatRate ?? 14) / 100;
const securityCfg = () => ({ idleMin: +cfg().idleMinutes || 30, maxHours: +cfg().sessionHours || 12, attempts: +cfg().lockoutAttempts || 5, lockMin: +cfg().lockoutMinutes || 15, pwMin: +cfg().passwordMinLength || 12 });
const brand = () => ({ app: cfg().appName || 'Project Tracker', project: cfg().projectName || 'BOCRA and UASF Trust websites', sub: cfg().appSubtitle || 'BOCRA and UASF Trust websites' });

/* ---------- Store ---------- */

const STORE_KEY = 'bdih-ptt-v6';
const Store = {
  state: null,
  load() {
    try { const raw = localStorage.getItem(STORE_KEY); if (raw) this.state = JSON.parse(raw); } catch (e) { this.state = null; }
    if (!this.state || !this.state.settings) this.state = seedState();
    runSchedule(this.state);
  },
  save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(this.state, (k, v) => (k[0] === '_' ? undefined : v)));
    } catch (e) {
      if (typeof toast === 'function') toast('Could not save in this browser: ' + e.message, 'err');
    }
  },
  reset() {
    try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
    this.state = seedState();
    runSchedule(this.state);
    this.save();
  }
};

function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

// Prototype only: a salted FNV-1a hash. Production uses Supabase Auth hashing.
function hashPw(pw) {
  let h = 0x811c9dc5;
  const s = 'bdih-ptt:' + pw;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return 'fnv$' + h.toString(16);
}

function passwordProblem(pw, username) {
  const min = securityCfg().pwMin;
  if (pw.length < min) return 'Passwords must be at least ' + min + ' characters.';
  if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return 'Passwords need at least one letter and one digit.';
  const low = pw.toLowerCase();
  if (COMMON_PASSWORDS.includes(low) || (username && low.includes(username.toLowerCase()))) return 'That password is too common or contains your username. Choose another.';
  return null;
}

<script>
/* js/brand.js */
'use strict';
/* Logos. Vector redraws of the Botswana Innovation Hub, BOCRA and UASF marks are used by default.
   To use the official artwork instead, save the files as assets/logos/bdih.png, bocra.png and
   uasf.png (PNG, SVG or JPG with the same base name); the app picks them up automatically. */

const LOGO_FILES = { bdih: null, bocra: null, uasf: null };

function probeLogos(done) {
  let pending = 0;
  Object.keys(LOGO_FILES).forEach(k => ['png', 'svg'].forEach(ext => {
    pending++;
    const img = new Image();
    img.onload = () => { if (!LOGO_FILES[k]) LOGO_FILES[k] = img.src; if (--pending === 0) done(); };
    img.onerror = () => { if (--pending === 0) done(); };
    img.src = 'assets/logos/' + k + '.' + ext;
  }));
}

function mixHex(a, b, t) {
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const ARC_STOPS = [[0, '#a7a88f'], [0.16, '#c8c49b'], [0.27, '#f5d38a'], [0.35, '#f2b33d'], [0.44, '#e3892d'],
  [0.5, '#8f2a22'], [0.6, '#b8452a'], [0.7, '#e7a48c'], [0.84, '#d8785b'], [1, '#a5311f']];
function arcColor(t, ring) {
  let i = 0;
  while (i < ARC_STOPS.length - 2 && t > ARC_STOPS[i + 1][0]) i++;
  const [t0, c0] = ARC_STOPS[i], [t1, c1] = ARC_STOPS[i + 1];
  const c = mixHex(c0, c1, (t - t0) / (t1 - t0));
  return t > 0.55 && t < 0.9 ? mixHex(c, '#ffffff', ring * 0.08) : c;
}

// The fanned tile arc of the Botswana Innovation Hub mark
function bihArc(cx, cy) {
  const rings = [[30, 40], [43, 54], [57, 69], [72, 86]], N = 18, a0 = 250, a1 = 18;
  const pt = (r, deg) => { const a = deg * Math.PI / 180; return (cx + r * Math.cos(a)).toFixed(1) + ' ' + (cy - r * Math.sin(a)).toFixed(1); };
  let out = '';
  rings.forEach(([r1, r2], ri) => {
    for (let k = 0; k < N; k++) {
      if (ri === 0 && (k < 2 || k > 14)) continue;
      if (ri === 1 && k > 16) continue;
      const gap = 0.12;
      const A = a0 - (a0 - a1) * ((k + gap) / N), B = a0 - (a0 - a1) * ((k + 1 - gap) / N);
      out += `<path d="M${pt(r1 + 1, A)} L${pt(r2, A)} A${r2} ${r2} 0 0 1 ${pt(r2, B)} L${pt(r1 + 1, B)} A${r1 + 1} ${r1 + 1} 0 0 0 ${pt(r1 + 1, A)}Z" fill="${arcColor((k + 0.5) / N, ri)}"/>`;
    }
  });
  return out;
}

function bihLogo(cls) {
  if (LOGO_FILES.bdih) return `<img class="${cls || ''}" src="${LOGO_FILES.bdih}" alt="Botswana Innovation Hub">`;
  return `<svg class="${cls || ''}" viewBox="0 0 330 190" role="img" aria-label="Botswana Innovation Hub">${bihArc(98, 96)}
    <text x="78" y="138" font-family="'Google Sans Flex','Google Sans','Roboto',sans-serif" font-size="58" font-weight="500" fill="#6e1f23" letter-spacing="-1">B<tspan fill="#7d7a3a">o</tspan>tswana</text>
    <text x="80" y="170" font-family="'Google Sans Flex','Google Sans','Roboto',sans-serif" font-size="17.5" font-weight="700" fill="#2a2321" letter-spacing="7.2">INNOVATION HUB</text></svg>`;
}
function bihMark(cls) {
  return `<svg class="${cls || ''}" viewBox="8 6 180 180" aria-hidden="true">${bihArc(98, 96)}</svg>`;
}
function bocraLogo(cls) {
  if (LOGO_FILES.bocra) return `<img class="${cls || ''}" src="${LOGO_FILES.bocra}" alt="BOCRA">`;
  return `<svg class="${cls || ''}" viewBox="0 0 150 58" role="img" aria-label="BOCRA">
    <text x="2" y="34" font-family="'Google Sans Flex','Google Sans','Roboto',sans-serif" font-size="38" font-weight="600" fill="#8a8d91" letter-spacing="1">BOCRA</text>
    ${['#0f7f86', '#3d8b3a', '#8a1c2b', '#5b3a7c'].map((c, i) => `<circle cx="${30 + i * 19}" cy="49" r="5.6" fill="${c}"/>`).join('')}</svg>`;
}
function uasfLogo(cls) {
  if (LOGO_FILES.uasf) return `<img class="${cls || ''}" src="${LOGO_FILES.uasf}" alt="UASF">`;
  // Colour ribbons sweeping down and round under a grey wordmark, three dots above
  return `<svg class="${cls || ''}" viewBox="0 0 214 128" role="img" aria-label="UASF">
    <path d="M36 34 C12 60 14 102 64 118" stroke="#c4175c" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M52 42 C34 64 38 94 70 106" stroke="#f3c300" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M66 54 C56 72 60 88 82 95" stroke="#2f9d58" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M78 68 C74 104 126 120 204 104" stroke="#1d86c6" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="42" cy="23" rx="11" ry="8.5" fill="#c4175c" transform="rotate(-18 42 23)"/>
    <circle cx="62" cy="16" r="6" fill="#1d86c6"/><circle cx="75" cy="29" r="6" fill="#2f9d58"/>
    <circle cx="136" cy="44" r="3" fill="#29b6e8"/><circle cx="162" cy="44" r="3" fill="#222"/><circle cx="188" cy="44" r="3" fill="#29b6e8"/>
    <text x="86" y="93" font-family="'Google Sans Flex','Google Sans','Roboto',sans-serif" font-size="46" font-weight="700" fill="#6b6b6d" letter-spacing="1">UASF</text></svg>`;
}
function wsLogo(ws, cls) { return ws === 'A' ? bocraLogo(cls) : ws === 'B' ? uasfLogo(cls) : bihMark(cls); }

  S.audit.push({ id: 'au-b1d', at: T('2026-10-23', '09'), user: 'u8', ip: 'seed', action: 'document.download', entity: 'document', entityId: 'b1', before: null, after: { version: 2 } });
  S.audit.push({ id: 'au-b1e', at: T('2026-10-23', '11'), user: 'u10', ip: 'seed', action: 'document.download', entity: 'document', entityId: 'b1', before: null, after: { version: 2 } });
